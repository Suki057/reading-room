<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>读书工作台 · Reading Workbench</title>
<meta name="build" content="v28-home-first" />
<!-- 字体用回苹果系统 SF Pro 栈（清爽、有质感） -->
<style>
  :root {
    color-scheme: light;
    --paper:      #FDFAF6;
    --surface:    rgba(255,255,255,0.64);
    --surface-2:  rgba(255,255,255,0.46);
    --ink:        #33414a;
    --ink-soft:   #62727c;
    --muted:      #93a1aa;
    --line:       rgba(255,255,255,0.78);
    --line-soft:  rgba(255,255,255,0.52);
    --accent:     #8FCFE3;
    --accent-2:   #A8DDF0;
    --accent-ink: #3f8ba6;
    --accent-soft: rgba(143,207,227,0.24);
    --coral:      #F9E6B8;
    --coral-soft: rgba(249,230,184,0.24);
    --pink:       #F9E6B8;
    --pink-soft:  rgba(249,230,184,0.24);
    --pink-ink:   #A67C3D;
    --amber:      #FCECC6;
    --amber-soft: rgba(252,236,198,0.26);
    --radius: 26px;
    --radius-sm: 18px;
    --shadow-xs: 0 2px 6px rgba(45,58,66,.06), inset 0 1px 0 rgba(255,255,255,.55);
    --shadow-sm: 0 10px 28px rgba(45,58,66,.10), inset 0 1px 0 rgba(255,255,255,.60);
    --shadow-md: 0 20px 50px rgba(45,58,66,.14), inset 0 1px 0 rgba(255,255,255,.65);
    --shadow-lg: 0 36px 84px rgba(45,58,66,.18), inset 0 1px 0 rgba(255,255,255,.70);
    --ease: cubic-bezier(0.22, 0.8, 0.36, 1);
    --blur: blur(30px) saturate(200%);
    --font-display: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", -apple-system, sans-serif;
    --font-ui: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", -apple-system, sans-serif;

    /* liquid-glass scenery tokens */
    --sun-glow: rgba(143,207,227,.32);
    --sun-disk: #8FCFE3;
    --hero-sky: #f4fafc;
    --hero-far: #e2f1f7;
    --hero-mid: #eef8fb;
    --hero-near: #fdf8f0;
    --mtn-far: rgba(143,207,227,.22);
    --mtn-mid: rgba(168,221,240,.18);
    --mtn-near: rgba(200,232,243,.15);
    --mist: rgba(255,255,255,.52);
    --bird: #7d8b93;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --paper:      #1e2830;
    --surface:    rgba(255,255,255,0.12);
    --surface-2:  rgba(255,255,255,0.08);
    --ink:        #eef5f8;
    --ink-soft:   #bccbd4;
    --muted:      #829099;
    --line:       rgba(255,255,255,0.18);
    --line-soft:  rgba(255,255,255,0.10);
    --accent:     #8ed3e8;
    --accent-2:   #a8ddf0;
    --accent-ink: #b5e5f4;
    --accent-soft: rgba(142,211,232,0.22);
    --coral:      #f5dca6;
    --coral-soft: rgba(245,220,166,0.22);
    --amber:      #f7e6c4;
    --amber-soft: rgba(247,230,196,0.18);
    --sun-glow: rgba(142,211,232,.22);
    --blur: blur(32px) saturate(180%);
    --sun-disk: #b5e5f4;
    --hero-sky: #1e2830;
    --hero-far: #27343e;
    --hero-mid: #222e37;
    --hero-near: #1a232b;
    --mtn-far: rgba(142,211,232,.22);
    --mtn-mid: rgba(142,211,232,.20);
    --mtn-near: rgba(181,229,244,.10);
    --mist: rgba(255,255,255,.06);
    --bird: #93a3ac;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font-ui); color: var(--ink); background: linear-gradient(180deg, #FDFBF7 0%, #EDF7FB 55%, #D6EEF7 100%) fixed; -webkit-font-smoothing: antialiased; line-height: 1.6; overflow: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: rgba(255,255,255,.28);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 15% 18%, rgba(143,207,227,.16), transparent 42%),
      radial-gradient(circle at 88% 24%, rgba(168,221,240,.14), transparent 40%),
      radial-gradient(circle at 72% 86%, rgba(143,207,227,.13), transparent 46%),
      radial-gradient(circle at 32% 78%, rgba(200,232,243,.12), transparent 50%),
      radial-gradient(circle at 52% 48%, rgba(255,255,255,.25), transparent 58%);
  }
  @keyframes orbFloat { from { transform: translate3d(-1.5%, -1%, 0) scale(1); } to { transform: translate3d(2%, 1.5%, 0) scale(1.06); } }
  button { font-family: inherit; cursor: pointer; }

  /* soft pastel blobs */
  /* ambient daily background (set via JS: bg-photo + bg-tint) */

  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

  /* Sidebar - 浅灰蓝液态玻璃 */
  .sidebar { display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(255,255,255,0.58) 0%, rgba(255,255,255,0.36) 55%, rgba(237,247,251,0.44) 100%); border-right: 1px solid var(--line); min-height: 0; box-shadow: var(--shadow-lg); position: relative; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .sidebar::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.85); pointer-events: none; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 18px 18px 16px; border-bottom: 1px solid var(--line-soft); }
  .avatar { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 22px; color: #fff; overflow: hidden; background: linear-gradient(150deg, #8FCFE3, #FCECC6); box-shadow: var(--shadow-sm), 0 0 20px rgba(143,207,227,.35); position: relative; }
  .avatar::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; z-index: 1; }
  .brand-text { flex: 1; min-width: 0; }
  .brand-text h1 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0; letter-spacing: .3px; line-height: 1.1; color: var(--ink); }
  .brand-text p { margin: 2px 0 0; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .theme-toggle { width: 36px; height: 36px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; color: var(--ink-soft); display: grid; place-items: center; transition: all .2s var(--ease); }
  .bg-roll { width: 36px; height: 36px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; color: var(--ink-soft); font-size: 16px; display: grid; place-items: center; transition: all .2s var(--ease); }
  .bg-roll:hover { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); transform: rotate(-12deg); }
  .theme-toggle:hover { color: var(--accent-ink); border-color: var(--accent); transform: translateY(-1px); }
  .theme-toggle svg { width: 18px; height: 18px; }

  .search { padding: 14px 16px 6px; }
  .search-box { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border: none; background: transparent; border-radius: 13px; color: var(--ink); font-size: 16px; font-family: inherit; transition: all .2s var(--ease); }
  .search input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input::placeholder { color: var(--muted); }

  .sidebar-actions { padding: 12px 16px 4px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 13px; font-size: 13.5px; font-weight: 700; font-family: inherit; padding: 9px 14px; transition: all .2s var(--ease); }
  .btn-ghost { width: 100%; background: var(--surface); color: var(--ink-soft); border-color: var(--line); }
  .btn-ghost:hover { color: var(--accent-ink); border-color: var(--accent); background: rgba(143,207,227,0.14); }
  .btn-accent { background: linear-gradient(150deg, #8FCFE3, #FCECC6); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-accent:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn:active { transform: translateY(0); }

  .cat-list { flex: 1; overflow-y: auto; padding: 8px 12px 16px; min-height: 0; }
  .cat-list::-webkit-scrollbar, .detail-inner::-webkit-scrollbar { width: 9px; }
  .cat-list::-webkit-scrollbar-thumb, .detail-inner::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; border: 2px solid var(--surface); }

  input.nav-name { flex: 1; min-width: 0; border: none; background: transparent; color: inherit; font-family: inherit; font-weight: 700; font-size: 16px; padding: 3px 4px; border-radius: 7px; transition: background .15s var(--ease); }
  input.nav-name[readonly] { cursor: pointer; }
  input.nav-name:focus { outline: none; background: rgba(143,207,227,0.14); box-shadow: 0 0 0 2px rgba(143,207,227,0.18); }
  /* 双击重命名悬停提示 */
  .renameable { position: relative; }
  .renameable.nav-wrap { flex: 1; display: flex; align-items: center; min-width: 0; }
  .rename-hint {
    position: absolute; top: 50%; right: 4px;
    transform: translateY(-50%) scale(.85);
    font-size: 12px; line-height: 1; pointer-events: none;
    opacity: 0; transition: opacity .15s var(--ease), transform .15s var(--ease);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.18));
  }
  .renameable:hover .rename-hint { opacity: .92; transform: translateY(-50%) scale(1); }
  .detail-title-wrap .rename-hint { top: 6px; transform: none; }
  .detail-title-wrap:hover .rename-hint { transform: none; }
  .sect-title.renameable { cursor: pointer; }
  .sect-title.renameable::after {
    content: " 📝"; font-size: 12px; opacity: 0; transition: opacity .15s var(--ease);
  }
  .sect-title.renameable:hover::after { opacity: .8; }

  .nav-home { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); margin-bottom: 8px; transition: all .18s var(--ease); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .nav-home:hover { border-color: var(--accent); color: var(--accent-ink); background: rgba(255,255,255,0.65); }
  .nav-home.is-active { background: linear-gradient(135deg, rgba(143,207,227,0.22), rgba(252,236,198,0.16)); border-color: rgba(143,207,227,0.45); color: var(--accent-ink); }
  .home-ic { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .nav-home.is-active .home-ic { color: var(--accent-ink); }

  .cat { margin-bottom: 6px; }
  .cat-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 9px; border: none; background: transparent; border-radius: 12px; color: var(--ink); text-align: left; transition: background .18s var(--ease); }
  .cat-head:hover { background: var(--surface-2); }
  .cat-chevron { font-size: 10px; color: var(--muted); transition: transform .22s var(--ease); width: 12px; flex: none; }
  .cat.collapsed .cat-chevron { transform: rotate(-90deg); }
  .cat-emoji { width: 28px; height: 28px; flex: none; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; line-height: 1; display: grid; place-items: center; transition: all .18s var(--ease); padding: 0; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .cat-emoji:hover { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.06); }
  .cat-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }
  .cat-count { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--line-soft); padding: 1px 8px; border-radius: 20px; flex: none; }
  .cat-add { width: 24px; height: 24px; flex: none; border-radius: 8px; display: grid; place-items: center; font-size: 17px; line-height: 1; color: var(--muted); background: transparent; border: 1px solid transparent; transition: all .18s var(--ease); }
  .cat-add:hover { color: var(--accent-ink); background: rgba(143,207,227,0.14); border-color: var(--accent); }
  .cat-del { width: 24px; height: 24px; flex: none; border-radius: 8px; display: grid; place-items: center; font-size: 14px; line-height: 1; color: var(--muted); background: transparent; border: 1px solid transparent; opacity: 0; transition: all .18s var(--ease); }
  .cat-head:hover .cat-del { opacity: 1; }
  .cat-del:hover { color: var(--coral); background: var(--coral-soft); border-color: var(--coral); }
  .cat-books { overflow: hidden; }
  .cat.collapsed .cat-books { display: none; }

  .book-item { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 10px 9px 30px; border: none; background: transparent; border-radius: 11px; color: var(--ink-soft); text-align: left; transition: all .16s var(--ease); position: relative; cursor: pointer; }
  .book-item::before { content: ""; position: absolute; left: 18px; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: var(--line); transform: translateY(-50%); transition: background .16s var(--ease); }
  .book-item:hover { background: var(--surface-2); color: var(--ink); }
  .book-item.is-active { background: var(--cat-soft, var(--accent-soft)); color: var(--cat, var(--accent-ink)); font-weight: 700; }
  .book-item.is-active::before { background: var(--cat, var(--accent)); }
  .entry-name { color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
  .book-item.is-done .mini-bar i { background: var(--amber); box-shadow: 0 0 8px rgba(253,240,212,.45); }
  .book-item.is-done::before { background: var(--amber); }
  .mini-bar { width: 38px; height: 5px; flex: none; border-radius: 5px; background: var(--line); overflow: hidden; }
  .mini-bar i { display: block; height: 100%; width: 0%; background: var(--cat, var(--accent)); border-radius: 5px; transition: width .4s var(--ease); box-shadow: 0 0 8px rgba(143,207,227,.35); }

  .sidebar-foot { padding: 12px 20px; border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--muted); display: flex; gap: 14px; font-weight: 600; }
  .sidebar-foot b { color: var(--ink-soft); font-weight: 800; }
  .empty-list { padding: 16px 14px; text-align: center; color: var(--muted); font-size: 13px; }

  /* emoji popover */
  .emoji-pop { position: fixed; z-index: 50; display: none; grid-template-columns: repeat(8, 1fr); gap: 4px; width: 296px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .emoji-pop.open { display: grid; animation: rise .2s var(--ease) both; }
  .emoji-pop button { font-size: 20px; line-height: 1; padding: 6px; border: none; background: transparent; border-radius: 9px; transition: all .14s var(--ease); }
  .emoji-pop button:hover { background: rgba(143,207,227,0.18); transform: scale(1.15); }

  /* Detail */
  .detail { min-width: 0; min-height: 0; overflow-y: auto; }
  .detail-inner { max-width: 880px; margin: 0 auto; padding: 36px 36px 80px; }
  .detail-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .icon-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 13px; font-size: 13px; font-weight: 700; color: var(--ink-soft); font-family: inherit; transition: all .18s var(--ease); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: rgba(143,207,227,0.14); }
  .icon-btn.danger:hover { border-color: var(--coral); color: var(--coral); }
  .detail-cat { flex: 1; font-size: 13px; color: var(--muted); font-weight: 600; }
  .detail-cat b { color: var(--cat, var(--accent-ink)); font-weight: 800; }

  .detail-head { margin-bottom: 28px; }
  .title-input { width: 100%; border: none; background: transparent; font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.12; color: var(--ink); padding: 0; margin: 0; border-bottom: 2px solid transparent; transition: border-color .2s var(--ease); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  .title-input:focus { outline: none; border-bottom-color: var(--accent); background: rgba(255,255,255,0.06); }
  .title-input[readonly] { cursor: default; }
  .title-input::placeholder { color: var(--muted); }
  .head-meta { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
  .pill-accent { background: var(--accent-soft); color: var(--accent-ink); }
  .pill-amber { background: var(--amber-soft); color: #a5673f; }
  .pill-muted { background: var(--surface); color: var(--muted); border: 1px solid var(--line-soft); }
  .pill-pink { background: var(--pink-soft); color: var(--pink-ink); }

  /* cover box - 冰水蓝液态玻璃 */
  .cover { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; background: linear-gradient(145deg, rgba(255,255,255,0.56) 0%, rgba(237,247,251,0.46) 52%, rgba(214,238,247,0.34) 100%); border: 1px solid rgba(255,255,255,0.72); border-radius: var(--radius); padding: 11px 13px; box-shadow: var(--shadow-sm); animation: rise .55s var(--ease) both; position: relative; overflow: hidden; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .cover::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); opacity: .9; pointer-events: none; }
  .cover-art { width: 78px; height: 106px; flex: none; border-radius: 10px; overflow: hidden; position: relative; box-shadow: var(--shadow-md); background: var(--surface-2); display: grid; }
  .cover-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-ph { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; text-align: center; padding: 8px; font-family: var(--font-display); font-weight: 700; color: #fff; font-size: 13px; line-height: 1.3; }
  .cover-side { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; padding-top: 1px; }
  .cover-side h3 { margin: 0; font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--ink); }
  .cover-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 11px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); font-family: inherit; transition: all .18s var(--ease); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .cover-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: rgba(143,207,227,0.14); }
  .cover-btn.loading { opacity: .6; pointer-events: none; }
  .cover-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 1px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .card { background: linear-gradient(145deg, rgba(255,255,255,0.58) 0%, rgba(255,255,255,0.42) 50%, rgba(255,255,255,0.28) 100%); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; transition: box-shadow .3s var(--ease), transform .3s var(--ease), border-color .3s var(--ease); animation: rise .55s var(--ease) both; transform-style: preserve-3d; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .card::before { content: ""; position: absolute; left: 16px; right: 16px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); opacity: .9; transition: opacity .3s var(--ease); pointer-events: none; }
  .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 0 0 1px rgba(255,255,255,.35); pointer-events: none; }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-5px) scale(1.01) perspective(1200px) rotateX(1.2deg); border-color: rgba(255,255,255,.85); }
  .card:hover::before { opacity: 1; }
  .grid .card:nth-child(1) { animation-delay: .03s; }
  .grid .card:nth-child(2) { animation-delay: .08s; }
  .grid .card:nth-child(3) { animation-delay: .13s; }
  .grid .card:nth-child(4) { animation-delay: .18s; }
  .card.span2 { grid-column: 1 / -1; }
  .card h2 { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
  .card h2 .num { font-family: var(--font-ui); font-size: 11px; font-weight: 800; color: var(--accent-ink); background: var(--accent-soft); width: 22px; height: 22px; border-radius: 8px; display: grid; place-items: center; }
  .sect-title { cursor: text; border-radius: 6px; padding: 1px 4px; margin: -1px -4px; transition: background .15s var(--ease), box-shadow .15s var(--ease); }
  .sect-title:hover { background: rgba(143,207,227,0.14); box-shadow: inset 0 0 0 1px var(--line); }
  .sect-title.editing { background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); cursor: text; outline: none; }
  .extra-h2 { display: flex; align-items: center; gap: 8px; }
  .extra-h2 .extra-title { flex: 1; }
  .del-extra { margin-left: auto; }
  /* 读书流程：阅读记录 / 自动进度 / 内容方框 */
  .flow-top { margin-bottom: 2px; }
  .read-log { margin-top: 8px; }
  .log-row { display: grid; grid-template-columns: 1fr 1fr 36px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .log-row.log-head { margin-bottom: 6px; }
  .log-row.log-head span { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .4px; }
  .log-date, .log-page { width: 100%; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); color: var(--ink); font-size: 16px; font-family: inherit; transition: border-color .18s var(--ease), background .18s var(--ease); }
  .log-date:focus, .log-page:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: rgba(255,255,255,0.72); }
  .log-empty { font-size: 13px; color: var(--muted); padding: 4px 2px 10px; }

  .del-flow { margin-left: auto; }
  .del-core { margin-left: auto; }

  .session-block { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; background: linear-gradient(145deg, rgba(255,255,255,0.58) 0%, rgba(237,247,251,0.38) 100%); box-shadow: var(--shadow-sm); position: relative; overflow: hidden; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .session-block::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); opacity: .9; pointer-events: none; }
  .session-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }

  .session-field textarea { width: 100%; min-height: 84px; }
  .btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 11px; }
  #addLog { width: auto; align-self: flex-start; }

  /* ===== 手写笔记内容框（康奈尔/双栏活页纸风格） ===== */
  .note-sheet { position: relative; border-radius: var(--radius); background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(237,247,251,0.56) 100%); border: 1px solid rgba(255,255,255,0.85); box-shadow: var(--shadow-sm), inset 0 0 0 1px rgba(255,255,255,.5); padding: 0; overflow: hidden; margin-top: 14px; }
  .note-sheet::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); pointer-events: none; }
  .note-punch { position: absolute; left: 0; top: 0; bottom: 0; width: 26px; display: flex; flex-direction: column; align-items: center; padding-top: 18px; gap: 34px; pointer-events: none; }

  .note-body { padding: 18px 20px 18px 42px; }
  .note-title { width: 100%; border: none; background: transparent; font-family: var(--font-display); font-size: 18px; font-weight: 800; color: var(--ink); padding: 0 0 8px; border-bottom: 2px solid rgba(143,207,227,0.25); margin-bottom: 14px; line-height: 1.3; }

  .note-row::after { content: ""; position: absolute; left: 50%; top: 8px; bottom: 8px; width: 1px; background: linear-gradient(180deg, transparent, rgba(45,58,66,0.10) 20%, rgba(45,58,66,0.10) 80%, transparent); }
  .note-col { position: relative; padding: 12px 14px; min-height: 84px; }
  .note-col textarea { width: 100%; min-height: 74px; border: none; background: transparent; resize: vertical; padding: 0; font-size: 16px; line-height: 1.75; color: var(--ink); font-family: inherit; box-shadow: none; }
  .note-col textarea:focus { outline: none; background: transparent; box-shadow: none; }
  .note-col textarea::placeholder { color: var(--muted); opacity: .55; }
  .note-col-left textarea::placeholder { content: "要点 / 方法 / 概念"; }
  .note-col-right textarea::placeholder { content: "案例 / 例子 / 延伸"; }
  /* 横线纸效果 */
  .note-col { background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(143,207,227,0.10) 27px, rgba(143,207,227,0.10) 28px); background-attachment: local; }

  .note-color-red { background: #F9E6B8; }
  .note-color-blue { background: #8FCFE3; }
  .note-color-green { background: #FCECC6; }
  .note-color-purple { background: #BFE3EF; }
  .btn-add-row { display: inline-flex; align-items: center; gap: 5px; border: 1px dashed var(--line); background: rgba(255,255,255,0.35); color: var(--ink-soft); border-radius: 11px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; transition: all .18s var(--ease); }
  .btn-add-row:hover { background: rgba(255,255,255,0.55); border-color: var(--accent); color: var(--accent-ink); }
  .note-del-row { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 13px; transition: all .15s var(--ease); }
  .note-del-row:hover { background: var(--coral-soft); color: var(--coral); border-color: var(--coral); }
  .note-row[data-color="red"] .note-col textarea { color: #A67C3D; }

  .note-row[data-color="green"] .note-col textarea { color: #A67C3D; }
  .note-row[data-color="purple"] .note-col textarea { color: #3f8ba6; }

  @media (max-width: 860px) {
    .note-row { grid-template-columns: 1fr; }

  }
  .extras { display: flex; flex-direction: column; gap: 20px; }
  .add-extra { align-self: flex-start; margin-top: 16px; }
  .btn.confirming { background: var(--danger, #e86a6a); border-color: var(--danger, #e86a6a); color: #fff; }

  .progress-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); color: var(--ink); font-size: 16px; font-family: inherit; transition: all .18s var(--ease); }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: rgba(255,255,255,0.72); }
  .field input[type=number]::-webkit-outer-spin-button, .field input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field input[type=number] { -moz-appearance: textfield; }

  .stepper { display: flex; align-items: stretch; }
  .stepper button { width: 40px; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); font-size: 18px; line-height: 1; font-weight: 700; transition: all .16s var(--ease); }
  .stepper button:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); border-right: none; }
  .stepper button:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; border-left: none; }
  .stepper button:hover { color: var(--accent-ink); background: var(--accent-soft); }
  .stepper input { border-radius: 0 !important; text-align: center; border-left: none !important; border-right: none !important; }

  textarea { width: 100%; min-height: 130px; resize: vertical; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); color: var(--ink); font-size: 16px; line-height: 1.7; font-family: inherit; transition: all .18s var(--ease); }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: rgba(255,255,255,0.72); }
  textarea::placeholder { color: var(--muted); }

  .progress-bar { margin-top: 18px; height: 13px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .progress-fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, #8FCFE3, #FCECC6); border-radius: 20px; transition: width .6s var(--ease); box-shadow: 0 0 14px rgba(143,207,227,.45); }
  .progress-fill::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(100deg, transparent 25%, rgba(255,255,255,.7) 50%, transparent 75%); background-size: 200% 100%; animation: shimmer 2.4s linear infinite; }
  .progress-bar.is-done .progress-fill { background: linear-gradient(90deg, #F9E6B8, #FDF0D4); box-shadow: 0 0 14px rgba(249,230,184,.45); }
  .progress-label { margin-top: 9px; display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-soft); }
  .progress-label b { font-family: var(--font-display); font-size: 22px; color: var(--ink); }
  .progress-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .mark-done { margin-top: 16px; }

  /* Home view */
  .home-hero { position: relative; border-radius: 30px; overflow: hidden; padding: 18px 22px; margin-bottom: 24px; background: linear-gradient(135deg, rgba(255,255,255,0.62) 0%, rgba(237,247,251,0.46) 60%, rgba(214,238,247,0.38) 100%); border: 1px solid rgba(255,255,255,.32); box-shadow: 0 20px 46px rgba(45,58,66,.10), 0 3px 12px rgba(45,58,66,.05), inset 0 1px 1px rgba(255,255,255,.55); min-height: auto; display: flex; align-items: center; animation: rise .6s var(--ease) both; isolation: isolate; }

  .home-hero .hero-date { margin: 0; text-shadow: none; }
  .hero-weather { margin: 0; font-size: 14px; font-weight: 700; color: var(--ink); text-shadow: none; }
  .hero-date { font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
  .home-hero h1 { display: none; }
  .hero-sub { display: none; }
  .hero-sun { transform-origin: 624px 74px; animation: floatY 7s ease-in-out infinite; }
  .daily-quote { margin: 0 0 30px; padding: 16px 22px; border-left: 4px solid var(--accent); border-radius: 0 16px 16px 0; background: linear-gradient(145deg, rgba(255,255,255,0.58) 0%, rgba(237,247,251,0.38) 100%); box-shadow: var(--shadow-xs); font-family: var(--font-display); font-size: 16px; font-style: italic; color: var(--ink-soft); animation: rise .6s var(--ease) .06s both; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .daily-quote cite { display: block; margin-top: 8px; font-style: normal; font-size: 13px; color: var(--muted); font-family: var(--font-ui); font-weight: 600; }
  .quote-panel { margin: 0 0 30px; padding: 16px 20px 6px; background: linear-gradient(145deg, rgba(255,255,255,0.60) 0%, rgba(237,247,251,0.40) 100%); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); animation: rise .55s var(--ease) both; }
  .quote-head { font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--accent-ink); margin-bottom: 10px; letter-spacing: .5px; }
  .quote-panel .daily-quote { margin: 0 0 10px; background: none; border: none; border-radius: 0; box-shadow: none; padding: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
  .stat-card { background: linear-gradient(145deg, rgba(255,255,255,0.62) 0%, rgba(237,247,251,0.40) 100%); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 4px; transition: transform .28s var(--ease), box-shadow .28s var(--ease); animation: rise .55s var(--ease) both; position: relative; overflow: hidden; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .stat-card::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); opacity: .9; pointer-events: none; }
  .stat-card:hover { transform: translateY(-5px) scale(1.015) perspective(1200px) rotateX(1.2deg); box-shadow: var(--shadow-md); }
  .stat-grid .stat-card:nth-child(1) { animation-delay: .04s; background: linear-gradient(145deg, rgba(143,207,227,0.30) 0%, rgba(168,221,240,0.18) 100%); }
  .stat-grid .stat-card:nth-child(2) { animation-delay: .09s; background: linear-gradient(145deg, rgba(191,227,239,0.40) 0%, rgba(214,238,247,0.24) 100%); }
  .stat-grid .stat-card:nth-child(3) { animation-delay: .14s; background: linear-gradient(145deg, rgba(255,255,255,0.58) 0%, rgba(237,247,251,0.34) 100%); }
  .stat-grid .stat-card:nth-child(4) { animation-delay: .19s; background: linear-gradient(145deg, rgba(200,232,243,0.38) 0%, rgba(237,247,251,0.24) 100%); }
  .stat-num { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--accent-ink); line-height: 1; }
  .stat-lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .home-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .list-card { background: linear-gradient(145deg, rgba(255,255,255,0.60) 0%, rgba(237,247,251,0.38) 100%); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow-sm); animation: rise .55s var(--ease) both; transition: box-shadow .28s var(--ease), transform .28s var(--ease); position: relative; overflow: hidden; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .list-card::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); opacity: .9; pointer-events: none; }
  .list-card:hover { box-shadow: var(--shadow-md); transform: translateY(-5px) scale(1.015) perspective(1200px) rotateX(1.2deg); }
  .home-cols .list-card:nth-child(1) { animation-delay: .12s; background: linear-gradient(145deg, rgba(143,207,227,0.28) 0%, rgba(237,247,251,0.28) 100%); }
  .home-cols .list-card:nth-child(2) { animation-delay: .18s; background: linear-gradient(145deg, rgba(168,221,240,0.30) 0%, rgba(255,255,255,0.26) 100%); }
  .list-card h2 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0 0 14px; }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 11px; cursor: pointer; transition: background .16s var(--ease); animation: rise .45s var(--ease) both; }
  .list-card .list-row:nth-child(2) { animation-delay: .04s; }
  .list-card .list-row:nth-child(3) { animation-delay: .08s; }
  .list-card .list-row:nth-child(4) { animation-delay: .12s; }
  .list-card .list-row:nth-child(5) { animation-delay: .16s; }
  .list-card .list-row:nth-child(6) { animation-delay: .20s; }
  .list-row:hover { background: rgba(255,255,255,0.45); }
  .list-row .lr-name { flex: 1; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .lr-meta { font-size: 12px; color: var(--muted); flex: none; font-weight: 600; }

  .welcome { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; color: var(--muted); }
  .welcome-mark { width: 88px; height: 88px; border-radius: 26px; margin-bottom: 22px; display: grid; place-items: center; font-size: 42px; background: linear-gradient(150deg, #8FCFE3, #FCECC6); box-shadow: var(--shadow-lg), 0 0 30px rgba(143,207,227,.35); }

  .sidebar-toggle { display: none; position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); z-index: 40; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-md); align-items: center; justify-content: center; touch-action: manipulation; cursor: pointer; }
  .sidebar-toggle svg { width: 20px; height: 20px; }
  .scrim { display: none; position: fixed; inset: 0; z-index: 19; background: rgba(45,58,66,.22); backdrop-filter: blur(3px); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; z-index: 20; top: 0; left: 0; bottom: 0; width: 300px; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateX(-100%); transition: transform .32s var(--ease); box-shadow: var(--shadow-lg); }

    .home-cols { grid-template-columns: 1fr; }
  }
  @media (min-width: 861px) { .scrim { display: none !important; } }
  /* undo toast */
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); z-index: 60; display: none; align-items: center; gap: 14px; padding: 12px 14px 12px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .25s var(--ease), transform .25s var(--ease); max-width: 92vw; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .toast.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-msg { font-size: 13.5px; font-weight: 700; color: var(--ink-soft); }
  .toast-undo { border: none; background: var(--accent); color: #fff; font-weight: 800; font-family: inherit; padding: 8px 16px; border-radius: 11px; font-size: 13px; transition: all .18s var(--ease); }
  .toast-undo:hover { background: var(--accent-2); }

  /* daily background photo */
  .bg-photo { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; background-repeat: no-repeat; opacity: 0; transition: opacity .5s ease, background-image .4s ease; }
  .bg-tint { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: transparent; }
  [data-theme="dark"] .bg-tint { background: transparent; }

  /* category theme color */
  .cat-emoji { background: rgba(255,255,255,0.10); }
  .book-item.is-active { border-left: 3px solid var(--cat, var(--accent)); background: var(--cat-soft, var(--accent-soft)); }
  .book-item .mini-bar i { background: var(--cat, var(--accent)); }
  .detail-cat b { color: var(--cat, var(--accent-ink)); }
  .detail-inner .num { background: var(--cat-soft, rgba(143,207,227,0.18)); }
  .cat-color { display: none; }
  .color-pop { display: none; }
  .color-grid { display: none; }

  function statCard(num, lbl, icon) { return '<div class="stat-card"><span class="stat-ic">' + (icon || "📊") + '</span><span class="stat-body"><span class="stat-num">' + num + '</span><span class="stat-lbl">' + lbl + "</span></span></div>"; }
  function byDateDesc(a, b) { return (b.finishedDate || "").localeCompare(a.finishedDate || ""); }
  function listCard(title, items, doneMode) {

  function field(label, control) { return '<div class="field"><label>' + label + "</label>" + control + "</div>"; }
  function stepper(val) {

  /* double-click to edit a title; returns to display on blur */
  function makeEditable(el, getVal, setVal) {
    el.addEventListener("dblclick", function () {
      if (el.isContentEditable) return;
      el.contentEditable = "true";
      el.classList.add("editing");
      el.focus();
      var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    });
    el.addEventListener("blur", function () {
      el.contentEditable = "false";
      el.classList.remove("editing");
      var v = (el.textContent || "").trim();
      setVal(v || getVal());
      if (!v) el.textContent = getVal();
    });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    });
  }

  function extrasHTML(b) {
    if (!b.extra || !b.extra.length) return "";
    var rows = b.extra.map(function (x) {
      return '<section class="card span2 extra-card" data-extra-id="' + x.id + '">' +

        '<textarea data-extra-body="' + x.id + '" placeholder="补充内容…">' + esc(x.body) + '</textarea>' +
      '</section>';
    }).join("");
    return '<div class="extras">' + rows + '</div>';

  /* 核心方框（复盘 / 内化出的结论 …）：动态编号 + 每个可删除 */
  function coreBoxesHTML(b) {
    var cores = [
      { key: "summary", sect: "summary", id: "fSummary", val: b.summary, ph: "核心观点、关键案例、印象最深的段落…" },
      { key: "conclusions", sect: "conclusions", id: "fConclusions", val: b.conclusions, ph: "沉淀为可复用的原则 / 行动清单 / 一句话信条…" }

        '<button class="icon-btn small del-core" data-core="' + c.key + '" title="删除此方框" type="button">🗑</button></h2>' +

  var coverTimer = null;
  function bindItem(b) {
    var title = document.getElementById("bookTitle");
    if (title) {
    title.addEventListener("input", function () {
      b.name = title.value; save();
      var nm = catList.querySelector('.nav-name[data-node="' + b.id + '"]');
      if (nm) nm.value = b.name || "未命名";
      clearTimeout(coverTimer);
      coverTimer = setTimeout(function () {
        b.coverName = b.name;
        fetchCovers(b.name).then(function (urls) {
          b.coverList = urls;
          b.coverIndex = 0;
          applyCover(b, urls.length ? urls[0] : "");
        });
      }, 700);
    });
    title.addEventListener("dblclick", function () {
      title.readOnly = false; title.focus(); title.select();
    });
    title.addEventListener("blur", function () { title.readOnly = true; });
    }

    [["fSummary", "summary"], ["fReview", "review"], ["fConclusions", "conclusions"]].forEach(function (p) {
      var el = document.getElementById(p[0]);
      if (!el) return;
      el.addEventListener("input", function () { b[p[1]] = el.value; save(); });
    });

    /* 删除核心方框（复盘 / 内化出的结论 …） */
    detail.querySelectorAll('.del-core').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-core");
        b.removedSections = b.removedSections || [];
        if (b.removedSections.indexOf(key) < 0) b.removedSections.push(key);
        save(); renderItem(b); renderSidebar();
      });
    });

    document.getElementById("delBook").addEventListener("click", function () {
      softDelete(b);
    });

    var back = document.getElementById("backBtn");
    if (back) back.addEventListener("click", function () {
      data.selectedId = "home";
      save(); renderSidebar(); renderDetail();
      if (window.matchMedia("(max-width: 860px)").matches) closeNav();
    });

    var ai = document.getElementById("coverAI");
    if (ai) ai.addEventListener("click", function () {
      ai.classList.add("loading");
      if (b.coverList && b.coverList.length > 1) {
        b.coverIndex = (b.coverIndex + 1) % b.coverList.length;
        applyCover(b, b.coverList[b.coverIndex]);
        ai.classList.remove("loading");
      } else {
        fetchCovers(b.name).then(function (urls) {
          b.coverList = urls;
          b.coverIndex = 0;
          applyCover(b, urls.length ? urls[0] : "");
          ai.classList.remove("loading");
        });
      }

    var upload = document.getElementById("coverUpload");
    var fileInput = document.getElementById("coverFile");
    if (upload && fileInput) {
      upload.addEventListener("click", function () { fileInput.click(); });
      fileInput.addEventListener("change", function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        processImageFile(f, function (dataUrl) { applyCover(b, dataUrl); });
        fileInput.value = "";
      });

    /* double-click to rename section titles (阅读进度与登记 / 内容总结 / 复盘 / 内化出的结论) */
    detail.querySelectorAll('.sect-title[data-sect]').forEach(function (el) {
      var sect = el.getAttribute("data-sect");
      if (sect === "extra") return;
      makeEditable(el,
        function () { return b.titles[sect]; },
        function (v) { b.titles[sect] = v; save(); });

    bindExtras(b);

  function bindExtras(b) {
    (b.extra || []).forEach(function (x) {
      var t = detail.querySelector('.extra-title[data-extra-id="' + x.id + '"]');
      if (t) makeEditable(t,
        function () { return x.title; },
        function (v) { x.title = v; save(); });
      var body = detail.querySelector('[data-extra-body="' + x.id + '"]');
      if (body) body.addEventListener("input", function () { x.body = body.value; save(); });
      var del = detail.querySelector('.del-extra[data-extra-id="' + x.id + '"]');

        save(); renderItem(b); renderSidebar();
      });
    });
    var add = document.getElementById("addExtra");
    if (add) add.addEventListener("click", function () {
      b.extra = b.extra || [];
      b.extra.push({ id: uid(), title: "补充栏 " + (b.extra.length + 1), body: "" });
      save(); renderItem(b);
    });

  /* 读书流程：阅读记录(日期→页数) + 自动进度条 + 内容方框 */
  function flowLatestPage(b) {
    var log = b.readLog || [], max = 0;
    log.forEach(function (r) { var p = clampInt(r.page || 0, 0); if (p > max) max = p; });
    return max;
  }
  function flowPct(b) {
    var total = clampInt(b.pages || 0, 0);
    if (!total) return 0;
    return Math.min(100, Math.round(flowLatestPage(b) / total * 100));
  }
  function flowSubText(b) {
    var total = clampInt(b.pages || 0, 0);
    if (!total) return "登记总页数后，进度条按阅读记录自动计算";
    return "最新读到 " + flowLatestPage(b) + " / " + total + " 页（共 " + ((b.readLog || []).length) + " 条记录）";
  }
  function updateFlowBar(b) {
    var pct = flowPct(b);
    var fill = document.getElementById("flowFill");
    var bar = document.getElementById("flowBar");
    var sub = document.getElementById("flowSub");
    var pl = document.getElementById("flowPct");
    if (fill) fill.style.width = pct + "%";
    if (bar) bar.classList.toggle("is-done", b.pages > 0 && flowLatestPage(b) >= clampInt(b.pages, 0));
    if (sub) sub.textContent = flowSubText(b);
    if (pl) pl.textContent = pct + "%";
  }
  function noteRowsHTML(rows, logIdx) {
    var colors = [{k:"ink",l:"黑"},{k:"red",l:"红"},{k:"blue",l:"蓝"},{k:"green",l:"绿"},{k:"purple",l:"紫"}];
    return (rows || []).map(function (row, ri) {
      return '<div class="note-row" data-log-idx="' + logIdx + '" data-row-idx="' + ri + '" data-color="' + esc(row.color || "ink") + '">' +
        '<div class="note-col note-col-left">' +
          '<textarea class="note-left" data-log-idx="' + logIdx + '" data-row-idx="' + ri + '" placeholder="要点 / 方法 / 概念">' + esc(row.left || "") + '</textarea>' +
        '</div>' +
        '<div class="note-col note-col-right">' +
          '<textarea class="note-right" data-log-idx="' + logIdx + '" data-row-idx="' + ri + '" placeholder="案例 / 例子 / 延伸">' + esc(row.right || "") + '</textarea>' +
        '</div>' +
      '</div>';
    }).join("") +
    '<div class="note-actions">' +
      '<button class="btn-add-row" type="button" data-log-idx="' + logIdx + '">＋ 添加一行</button>' +
      colors.map(function (c) {
        return '<button class="note-color note-color-' + c.k + '" data-color="' + c.k + '" data-log-idx="' + logIdx + '" title="整页标记为' + c.l + '色" type="button"></button>';
      }).join("") +
    '</div>';
  }
  function noteSheetHTML(r, i) {
    var rows = (r.notes && r.notes.rows) ? r.notes.rows : [];
    if (!rows.length) rows = [newNoteRow(r.summary || "", r.review || "", "ink")];
    return '<div class="note-sheet">' +
      '<div class="note-punch">' + Array(6).fill('<i></i>').join("") + '</div>' +
      '<div class="note-body">' +
        '<input type="text" class="note-title" data-log-idx="' + i + '" placeholder="本页标题（如：赢得用户信任）" value="' + esc((r.notes && r.notes.title) || "") + '" />' +
        '<div class="note-rows" data-log-idx="' + i + '">' + noteRowsHTML(rows, i) + '</div>' +
      '</div>' +
    '</div>';
  }
  function readBlocksHTML(b) {
    var log = b.readLog || [];
    if (!log.length) return '<div class="log-empty">还没有阅读记录，点下方「＋ 添加阅读记录」新建一个阅读板块吧</div>';
    return log.map(function (r, i) {
      return '<div class="session-block" data-log-idx="' + i + '">' +
        '<div class="session-head">' +
          '<span class="session-idx">📅 第 ' + (i + 1) + ' 次阅读</span>' +
          '<button class="icon-btn small del-log" data-log-idx="' + i + '" title="删除本次阅读板块" type="button">🗑</button>' +
        '</div>' +
        '<div class="log-row session-row">' +
          '<input type="date" class="log-date" value="' + esc(r.date || "") + '" />' +
          '<input type="number" class="log-page" min="0" placeholder="看到第几页" value="' + (r.page != null ? r.page : "") + '" />' +
        '</div>' +
        noteSheetHTML(r, i) +
      '</div>';
    }).join("");
  }
  /* flowBoxesHTML 已弃用：阅读板块现在每个记录自带 内容整理总结 + 复盘 */
  function flowHTML(b) {
    return '<section class="card span2 flow-card">' +
      '<h2><span class="num">📖</span><span class="sect-title renameable" data-sect="flow">' + esc(b.titles.flow) + '</span></h2>' +
      '<div class="flow-top">' + field("整本书总页数", '<input type="number" id="fPagesFlow" min="0" step="1" value="' + (b.pages || "") + '" placeholder="如 320" />') + '</div>' +
      '<div class="progress-bar flow-bar" id="flowBar"><div class="progress-fill" id="flowFill" style="width:' + flowPct(b) + '%"></div></div>' +
      '<div class="progress-label"><span class="progress-sub" id="flowSub">' + flowSubText(b) + '</span><b id="flowPct">' + flowPct(b) + '%</b></div>' +
      '<button class="btn btn-accent add-log-block" id="addLog" type="button">＋ 添加阅读记录</button>' +
      '<div class="read-blocks" id="readBlocks">' + readBlocksHTML(b) + '</div>' +
    '</section>';
  }
  function bindFlow(b) {
    var pf = document.getElementById("fPagesFlow");
    if (pf) pf.addEventListener("input", function () {
      b.pages = pf.value === "" ? 0 : clampInt(pf.value, 0);
      save(); updateProgress(b); updateFlowBar(b);
      var f1 = document.getElementById("fPages"); if (f1) f1.value = pf.value;
    });
    var addLog = document.getElementById("addLog");
    if (addLog) addLog.addEventListener("click", function () {
      b.readLog = b.readLog || [];
      b.readLog.push({ date: todayISO(), page: flowLatestPage(b), summary: "", review: "", notes: { title: "", rows: [newNoteRow("", "", "ink")] } });
      save(); renderItem(b); renderSidebar();
    });
    bindReadBlocks(b);
  }
  function bindReadBlocks(b) {
    detail.querySelectorAll('.session-block[data-log-idx]').forEach(function (block) {
      var idx = parseInt(block.getAttribute("data-log-idx"), 10);
      var r = (b.readLog || [])[idx];
      if (!r) return;
      var d = block.querySelector(".log-date");
      var p = block.querySelector(".log-page");
      var del = block.querySelector(".del-log");
      if (d) d.addEventListener("input", function () { r.date = d.value; save(); });
      if (p) p.addEventListener("input", function () { r.page = p.value === "" ? 0 : clampInt(p.value, 0); save(); updateFlowBar(b); updateProgress(b); });
      if (del) del.addEventListener("click", function () {
        b.readLog = (b.readLog || []).filter(function (_, i) { return i !== idx; });
        save(); renderItem(b); renderSidebar();
      });
      /* 手写笔记内容框绑定 */
      bindNoteSheet(block, r, b);
    });
  }
  function bindNoteSheet(block, r, b) {
    if (!r.notes) r.notes = { title: "", rows: [] };
    var nt = block.querySelector(".note-title");
    if (nt) nt.addEventListener("input", function () { r.notes.title = nt.value; save(); });
    block.querySelectorAll(".note-row").forEach(function (rowEl) {
      var ri = parseInt(rowEl.getAttribute("data-row-idx"), 10);
      var row = r.notes.rows[ri];
      if (!row) return;
      var left = rowEl.querySelector(".note-left");
      var right = rowEl.querySelector(".note-right");
      if (left) left.addEventListener("input", function () { row.left = left.value; save(); });
      if (right) right.addEventListener("input", function () { row.right = right.value; save(); });
    });
    var addRow = block.querySelector(".btn-add-row");
    if (addRow) addRow.addEventListener("click", function () {
      r.notes.rows.push(newNoteRow("", "", "ink"));
      save(); renderItem(b); renderSidebar();
    });
    block.querySelectorAll(".note-color").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var color = btn.getAttribute("data-color");
        r.notes.rows.forEach(function (row) { row.color = color; });
        save(); renderItem(b); renderSidebar();
      });
    });
  }
  /* bindFlowBoxes 已弃用：阅读板块现在每个记录自带 内容整理总结 + 复盘 */

  function updateProgress(b) {

  function updateHeadMeta(b) {

    if (!hm) return;

    if (done) meta += '<span class="pill pill-pink">✓ 已读完' + (b.finishedDate ? " · " + esc(b.finishedDate) : "") + "</span>";
    else if (b.pages > 0) meta += '<span class="pill pill-accent">已读 ' + pct + "%</span>";

  /* color picker removed per request */

  /* actions */
  function addCategory() {
    var c = { id: uid(), name: "新分类", type: "category", emoji: "📚", color: CATEGORY_COLORS[data.nodes.length % CATEGORY_COLORS.length], collapsed: false, children: [] };
    data.nodes.push(c);

    var inp = catList.querySelector('.nav-name[data-node="' + c.id + '"]');

  }
  function addItem(catId) {
    var c = findNode(catId);

  /* soft delete + undo + recycle bin */
  function softDelete(target) {
    var entry = { node: target };
    if (target.type === "category") {
      var idx = data.nodes.indexOf(target);
      if (idx < 0) return;
      entry.where = { kind: "root", index: idx };
      data.nodes.splice(idx, 1);
    } else {
      var parent = findParent(target.id);
      if (!parent) return;
      var ci = parent.children.indexOf(target);
      if (ci < 0) return;
      entry.where = { kind: "child", parentId: parent.id, index: ci };
      parent.children.splice(ci, 1);
    }
    data.trash = data.trash || [];
    data.trash.push(entry);
    if (data.trash.length > 60) data.trash.shift();
    if (data.selectedId === target.id) data.selectedId = "home";
    save(); renderSidebar(); renderDetail();
    showUndoToast(target);
  }
  function restoreEntry(entry) {
    if (!entry) return;
    if (entry.where.kind === "root") {
      data.nodes.splice(Math.min(entry.where.index, data.nodes.length), 0, entry.node);
    } else {
      var p = findNode(entry.where.parentId);
      if (p) { p.children = p.children || []; p.children.splice(Math.min(entry.where.index, p.children.length), 0, entry.node); }
    }
  }
  function undoDelete() {
    if (!data.trash || !data.trash.length) return;
    var entry = data.trash[data.trash.length - 1];
    restoreEntry(entry);
    data.trash.pop();
    save(); renderSidebar(); renderDetail();
    hideToast();
  }
  function parentNameOf(e) {
    if (e.where && e.where.kind === "child") {
      var p = findNode(e.where.parentId);
      return p ? p.name : "—";
    }
    return "—";
  }
  function renderTrash() {
    var list = data.trash || [];
    var html = '<div class="detail-inner"><div class="home">' +
      '<div class="home-hero simple"><h1>🗑️ 回收站</h1><p>' +
        (list.length ? ("共 " + list.length + " 项已删除 · 可在此恢复") : "暂无已删除的内容，安心阅读吧～") +
      '</p></div>';
    if (list.length) {
      html += '<div class="trash-actions"><button class="btn danger-outline" id="emptyTrash">清空回收站</button></div>';
      html += '<section class="list-card"><h2>已删除的内容</h2>';
      list.forEach(function (e, i) {
        var n = e.node;
        var icon = n.type === "category" ? (n.emoji || "📚") : "📄";
        var sub = n.type === "category" ? ("分类 · " + ((n.children && n.children.length) || 0) + " 个子条目") : ("来自：" + parentNameOf(e));
        html += '<div class="list-row trash-row">' +
          '<span class="lr-icon">' + icon + '</span>' +
          '<span class="lr-name">' + esc(n.name || "未命名") + '</span>' +
          '<span class="lr-meta">' + esc(sub) + '</span>' +
          '<button class="icon-btn small" data-restore="' + i + '">恢复</button>' +
        '</div>';
      });
      html += '</section>';
    }
    html += '</div></div>';
    detail.innerHTML = html;
    var et = document.getElementById("emptyTrash");
    if (et) et.addEventListener("click", function () {
      if (et.dataset.confirm === "1") {
        data.trash = []; save(); renderSidebar(); renderDetail();
        return;
      }
      et.dataset.confirm = "1";
      et.textContent = "确认清空？";
      et.classList.add("confirming");
      setTimeout(function () { et.dataset.confirm = ""; et.textContent = "清空回收站"; et.classList.remove("confirming"); }, 3500);
    });
    detail.querySelectorAll("[data-restore]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var i = parseInt(btn.getAttribute("data-restore"), 10);
        var entry = data.trash[i];
        if (!entry) return;
        restoreEntry(entry);
        data.trash.splice(i, 1);
        save(); renderSidebar(); renderDetail();
      });
    });
  }
  var toastTimer = null;
  function showUndoToast(node) {
    var toast = document.getElementById("toast");
    var msg = document.getElementById("toastMsg");
    if (!toast || !msg) return;
    msg.textContent = "已删除「" + (node.name || "未命名") + "」";
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() {
    var toast = document.getElementById("toast");
    if (toast) toast.classList.remove("show");
    clearTimeout(toastTimer);
  }

  /* process uploaded cover image (downscaled to keep localStorage small) */
  function processImageFile(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxW = 640;
        if (img.width <= maxW) { cb(reader.result); return; }
        var scale = maxW / img.width;
        var w = maxW, h = Math.round(img.height * scale);
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        try { cb(c.toDataURL("image/jpeg", 0.85)); } catch (e) { cb(reader.result); }
      };
      img.onerror = function () { cb(reader.result); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* sidebar events */
  catList.addEventListener("click", function (e) {
    var emo = e.target.closest('[data-act="emoji"]');
    if (emo) { e.stopPropagation(); showEmojiPop(emo.getAttribute("data-node"), emo); return; }
    var del = e.target.closest('[data-act="del-cat"]');
    if (del) { e.stopPropagation(); var dn = findNode(del.getAttribute("data-node")); if (dn) softDelete(dn); return; }
    var add = e.target.closest('[data-act="add-item"]');
    if (add) { e.stopPropagation(); addItem(add.getAttribute("data-node")); return; }
    var head = e.target.closest('[data-act="toggle"]');
    if (head && !e.target.closest('[data-act="rename"]')) {
      var n = findNode(head.getAttribute("data-node"));
      if (n) { n.collapsed = !n.collapsed; save(); renderSidebar(); }
      return;
    }
    var tr = e.target.closest('[data-act="trash"]');

    var sel = e.target.closest('[data-act="select"]');

  /* ===== 数据导出 / 导入（防止丢失） ===== */
  function showToast(msg) {
    var toast = document.getElementById("toast");
    var m = document.getElementById("toastMsg");
    if (!toast || !m) return;
    m.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function exportData() {
    try {
      var raw = localStorage.getItem(STORE_KEY) || "{}";
      var blob = new Blob([raw], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var d = new Date(), pad = function (n) { return (n < 10 ? "0" : "") + n; };
      a.href = url;
      a.download = "reading-workbench-backup-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast("已导出备份文件 ✅");
    } catch (e) { showToast("导出失败：" + e.message); }
  }
  function importData(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var obj = JSON.parse(reader.result);
        if (!obj || typeof obj !== "object" || !obj.nodes) throw new Error("不是有效的备份文件");
        if (!confirm("导入会覆盖当前设备上的全部数据，确定继续？")) return;
        localStorage.setItem(STORE_KEY, JSON.stringify(obj));
        showToast("导入成功，正在刷新…");
        setTimeout(function () { location.reload(); }, 700);
      } catch (e) { showToast("导入失败：" + e.message); }
    };
    reader.readAsText(file);
  }
  document.getElementById("exportData").addEventListener("click", exportData);
  document.getElementById("importData").addEventListener("click", function () { document.getElementById("importFile").click(); });
  document.getElementById("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    importData(f); e.target.value = "";
  });

  /* 自定义 App 图标 */
  var PERMA_URL = "https://suki057.github.io/reading-room/";
  function applyAvatar() {
    /* 侧栏头像：运行时改用用户上传的图（dataURL）。 */
    /* 主屏图标固定走仓库里的 icon-192.png 文件，避免 iOS 对 dataURL apple-touch-icon 支持不可靠。 */
    var img = document.getElementById("avatarImg");
    var emoji = document.getElementById("avatarEmoji");
    if (data.appIcon) {
      if (img) { img.src = data.appIcon; img.hidden = false; }
      if (emoji) emoji.style.display = "none";
    } else {
      if (img) { img.hidden = true; img.removeAttribute("src"); }
      if (emoji) emoji.style.display = "";
    }
  }
  function resizeIcon(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var im = new Image();
      im.onload = function () {
        var s = 512, c = document.createElement("canvas");
        c.width = c.height = s;
        var ctx = c.getContext("2d");
        ctx.clearRect(0, 0, s, s);
        /* 居中裁剪为正方形 */
        var side = Math.min(im.width, im.height);
        var sx = (im.width - side) / 2, sy = (im.height - side) / 2;
        ctx.drawImage(im, sx, sy, side, side, 0, 0, s, s);
        cb(c.toDataURL("image/png"));
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  document.getElementById("changeIcon").addEventListener("click", function () { document.getElementById("iconFile").click(); });
  document.getElementById("iconFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    resizeIcon(f, function (url) {
      data.appIcon = url; save(); applyAvatar();
      showToast("图标已更新 ✅ 重新「添加到主屏幕」即可生效");

  document.getElementById("copyUrl").addEventListener("click", function () {

  /* theme */

})();

/* PWA: 注册 Service Worker，使手机可「添加到主屏幕」当作 App 使用
   并内置「自动更新」机制：发现新版本时静默升级并刷新一次，
   这样手机主屏上的图标不用删掉重加，也能拿到最新功能。 */
if ('serviceWorker' in navigator) {
  var swRefreshing = false;
  // 新 Service Worker 接管页面后，自动刷新一次以加载新版本（只刷一次，避免死循环）
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      // 立即检查一次更新
      reg.update().catch(function () {});
      // 每次重新回到 App（切回前台）时也检查更新
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
      // 兜底：每小时检查一次
      setInterval(function () { reg.update().catch(function () {}); }, 3600000);
    }).catch(function () {});
  });
}
