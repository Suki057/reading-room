<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>读书工作台 · Reading Workbench</title>
<meta name="build" content="v89-no-zoom-no-autorefresh" />
<!-- 字体用回苹果系统 SF Pro 栈（清爽、有质感） -->
<style>
  :root {
    color-scheme: light;
    /* 森林木屋 + 奶油黄 配色：奶白苔绿底 + 森林绿强调 + 蜡笔角色色点缀 */
    --paper:      #F5F1E6;
    --surface:    rgba(255,253,247,0.86);
    --surface-2:  rgba(245,250,240,0.62);
    --ink:        #3A4034;
    --ink-soft:   #5E6B55;
    --muted:      #8A9A7D;
    --line:       rgba(255,255,255,0.82);
    --line-soft:  rgba(120,150,110,0.22);
    --accent:     #5D8C61;
    --accent-2:   #A3B18A;
    --accent-ink: #2E4A33;
    --accent-soft: rgba(93,140,97,0.18);
    --coral:      #D87C5F;
    --coral-soft: rgba(216,124,95,0.18);
    --coral-ink:  #9A4D38;
    --pink:       #E8C4A0;
    --pink-soft:  rgba(232,196,160,0.24);
    --pink-ink:   #8B6B4E;
    --amber:      #F2D06B;
    --amber-soft: rgba(242,208,107,0.26);
    --ink-line:   rgba(58,64,52,0.18);
    --crayon:     #4A5D43;
    --danger:     #D87C5F;
    --radius: 24px;
    --radius-sm: 18px;
    --shadow-xs: 0 2px 6px rgba(58,64,52,.07), inset 0 1px 0 rgba(255,255,255,.6);
    --shadow-sm: 0 10px 28px rgba(58,64,52,.12), inset 0 1px 0 rgba(255,255,255,.65);
    --shadow-md: 0 20px 50px rgba(58,64,52,.16), inset 0 1px 0 rgba(255,255,255,.7);
    --shadow-lg: 0 36px 84px rgba(58,64,52,.20), inset 0 1px 0 rgba(255,255,255,.75);
    --ease: cubic-bezier(0.22, 0.8, 0.36, 1);
    --blur: blur(14px) saturate(150%);
    --font-display: "PingFang SC", "苹方-简", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    --font-ui: "PingFang SC", "苹方-简", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;

    /* 森林木屋场景 token：奶白天 + 远山苔绿 + 奶油黄暖阳 */
    --sun-glow: rgba(232,245,220,.55);
    --sun-disk: #F0F4E8;
    --hero-sky: #F5F1E6;
    --hero-far: #DDE8D0;
    --hero-mid: #C5D9B5;
    --hero-near: #F0F4E8;
    --mtn-far: rgba(93,140,97,.16);
    --mtn-mid: rgba(163,177,138,.20);
    --mtn-near: rgba(255,255,255,.20);
    --mist: rgba(245,250,240,.6);
    --bird: #5E6B55;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --paper:      #2A3328;
    --surface:    rgba(255,255,255,0.10);
    --surface-2:  rgba(255,255,255,0.07);
    --ink:        #F0F4E8;
    --ink-soft:   #B8C9A9;
    --muted:      #8A9A7D;
    --line:       rgba(255,255,255,0.14);
    --line-soft:  rgba(255,255,255,0.08);
    --accent:     #8CB369;
    --accent-2:   #A3B18A;
    --accent-ink: #C5D9B5;
    --accent-soft: rgba(140,179,105,0.22);
    --coral:      #E89B82;
    --coral-soft: rgba(232,155,130,0.20);
    --coral-ink:  #F4C9BC;
    --pink:       #E6C987;
    --pink-soft:  rgba(230,201,135,0.20);
    --pink-ink:   #F2E0B8;
    --amber:      #E6C987;
    --amber-soft: rgba(230,201,135,0.20);
    --ink-line:   rgba(240,244,232,0.18);
    --crayon:     #F0F4E8;
    --danger:     #E89B82;
    --blur: blur(16px) saturate(150%);
    --sun-glow: rgba(232,245,220,.16);
    --sun-disk: #F0F4E8;
    --hero-sky: #2A3328;
    --hero-far: #2F3A2D;
    --hero-mid: #2A3328;
    --hero-near: #2F3A2D;
    --mtn-far: rgba(140,179,105,.18);
    --mtn-mid: rgba(163,177,138,.16);
    --mtn-near: rgba(255,255,255,.10);
    --mist: rgba(245,250,240,.05);
    --bird: #B8C9A9;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* 禁止 iOS 点击元素时整页双击放大；保留双指捏合缩放 */
  html, body, button, a, input, textarea, select, label, .btn, .icon-btn, .cat-card, .shelf-card, .list-row, .nav-tool, .topbar-menu { touch-action: manipulation; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font-ui); color: var(--ink); background: linear-gradient(180deg, #F7F5ED 0%, #EEF2E6 52%, #E4EBDA 100%) fixed; -webkit-font-smoothing: antialiased; line-height: 1.6; overflow: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: rgba(255,255,255,.30);
  }
  /* 森林树荫 + 奶油黄 光斑 */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 14% 16%, rgba(93,140,97,.16), transparent 42%),
      radial-gradient(circle at 88% 22%, rgba(242,208,107,.18), transparent 40%),
      radial-gradient(circle at 74% 88%, rgba(93,140,97,.10), transparent 46%),
      radial-gradient(circle at 30% 80%, rgba(163,177,138,.14), transparent 50%),
      radial-gradient(circle at 52% 50%, rgba(255,255,255,.32), transparent 58%);
  }
  @keyframes orbFloat { from { transform: translate3d(-1.5%, -1%, 0) scale(1); } to { transform: translate3d(2%, 1.5%, 0) scale(1.06); } }
  button { font-family: inherit; cursor: pointer; }

  /* soft pastel blobs */
  /* ambient daily background (set via JS: bg-photo + bg-tint) */

  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

  /* Sidebar - 森林木屋风液态玻璃 */
  .sidebar { display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(255,255,255,0.56) 0%, rgba(245,250,240,0.34) 55%, rgba(232,245,220,0.42) 100%); border-right: 1px solid var(--line); min-height: 0; box-shadow: var(--shadow-lg); position: relative; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .sidebar::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.85); pointer-events: none; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 18px 16px; border-bottom: 1px solid var(--line-soft); }
  .avatar { width: 56px; height: 56px; flex: none; border-radius: 18px; display: grid; place-items: center; font-size: 28px; color: #fff; overflow: hidden; background: linear-gradient(150deg, #6A9E6E, #5D8C61); box-shadow: var(--shadow-sm), 0 0 20px rgba(93,140,97,.32); position: relative; cursor: pointer; border: 2.5px solid var(--crayon); transition: transform .16s var(--ease); }
  .avatar:hover { transform: rotate(-4deg) scale(1.04); }
  .avatar::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 2px solid rgba(255,255,255,.55); }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; z-index: 1; }
  .brand-text { flex: 1; min-width: 0; }
  .brand-text h1 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0; letter-spacing: .3px; line-height: 1.1; color: var(--ink); }
  .brand-text p { margin: 2px 0 0; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); font-weight: 700; }

  .search { padding: 14px 16px 6px; }
  .search-box { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border: none; background: transparent; border-radius: 13px; color: var(--ink); font-size: 16px; font-family: inherit; transition: transform, background-color, border-color, box-shadow, opacity .2s var(--ease); }
  .search input:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input::placeholder { color: var(--muted); }

  .sidebar-actions { padding: 12px 16px 4px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 13px; font-size: 13.5px; font-weight: 700; font-family: inherit; padding: 9px 14px; transition: transform, background-color, border-color, box-shadow, opacity .2s var(--ease); }
  .btn-ghost { width: 100%; background: var(--surface); color: var(--ink-soft); border-color: var(--line); }
  .btn-ghost:hover { color: var(--accent-ink); border-color: var(--accent); background: rgba(93,140,97,0.14); }
  .btn-accent { background: linear-gradient(150deg, #6A9E6E, #5D8C61); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-accent:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn:active { transform: translateY(0); }

  .cat-list { flex: 1; overflow-y: auto; padding: 8px 12px 16px; min-height: 0; }
  .cat-list::-webkit-scrollbar, .detail-inner::-webkit-scrollbar { width: 9px; }
  .cat-list::-webkit-scrollbar-thumb, .detail-inner::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; border: 2px solid var(--surface); }

  input.nav-name { flex: 1; min-width: 0; border: none; background: transparent; color: inherit; font-family: inherit; font-weight: 700; font-size: inherit; padding: 3px 4px; border-radius: 7px; transition: background .15s var(--ease); }
  input.nav-name[readonly] { cursor: pointer; }
  input.nav-name:focus { outline: none; background: rgba(93,140,97,0.14); box-shadow: 0 0 0 2px rgba(93,140,97,0.18); }
  /* 双击重命名悬停提示 */
  .renameable { position: relative; }
  .renameable.nav-wrap { flex: 1; display: flex; align-items: center; min-width: 0; }
  .rename-hint {
    position: absolute; top: 50%; right: 4px;
    transform: translateY(-50%) scale(.85);
    font-size: 12px; line-height: 1; pointer-events: none;
    opacity: 0; transition: opacity .15s var(--ease), transform .15s var(--ease);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.18));
  }
  .renameable:hover .rename-hint { opacity: .92; transform: translateY(-50%) scale(1); }
  .detail-title-wrap .rename-hint { top: 6px; transform: none; }
  .detail-title-wrap:hover .rename-hint { transform: none; }
  .sect-title.renameable { cursor: pointer; }
  .sect-title.renameable::after {
    content: " 📝"; font-size: 12px; opacity: 0; transition: opacity .15s var(--ease);
  }
  .sect-title.renameable:hover::after { opacity: .8; }

  .nav-home { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); margin-bottom: 6px; font-size: 13.5px; transition: transform, background-color, border-color, box-shadow, opacity .18s var(--ease); }
  .nav-home:hover { border-color: var(--accent); color: var(--accent-ink); background: rgba(255,255,255,0.65); }
  .nav-home.is-active { background: linear-gradient(135deg, rgba(93,140,97,0.22), rgba(93,140,97,0.10)); border-color: rgba(93,140,97,0.45); color: var(--accent-ink); }
  .home-ic { width: 16px; height: 16px; flex: none; color: var(--muted); }
  .nav-home.is-active .home-ic { color: var(--accent-ink); }

  .cat { margin-bottom: 6px; }
  .cat-head { width: 100%; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: none; background: transparent; border-radius: 12px; color: var(--ink); text-align: left; transition: transform .25s var(--ease), background .18s var(--ease); }
  .cat-head:hover { background: var(--surface-2); }
  .cat-chevron { font-size: 7px; color: var(--muted); transition: transform .22s var(--ease); width: 12px; flex: none; }
  .cat.collapsed .cat-chevron { transform: rotate(-90deg); }
  .cat-emoji { display: none; }
  .cat-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; font-size: 12px; font-weight: 700; }
  .cat-count { font-size: 8.5px; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--line-soft); padding: 1px 8px; border-radius: 20px; flex: none; }
  .cat-add { width: 24px; height: 24px; flex: none; border-radius: 8px; display: grid; place-items: center; font-size: 17px; line-height: 1; color: var(--muted); background: transparent; border: 1px solid transparent; transition: transform, background-color, border-color, box-shadow, opacity .18s var(--ease); }
  .cat-add:hover { color: var(--accent-ink); background: rgba(93,140,97,0.14); border-color: var(--accent); }
  .cat-books { overflow: hidden; }
  .cat.collapsed .cat-books { display: none; }
  /* 左滑删除：.swipe-row 包裹行，滑动时行左移露出右侧红色删除键，点击删除→进回收站 */
  .swipe-row { position: relative; overflow: hidden; touch-action: pan-y; }
  .row-del { position: absolute; top: 0; right: 0; bottom: 0; width: 76px; border: none; background: var(--coral); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; transform: translateX(100%); transition: transform .25s var(--ease); z-index: 3; cursor: pointer; }
  .row-del:active { filter: brightness(.92); }
  .swipe-row.swiped .cat-head, .swipe-row.swiped .book-item { transform: translateX(-76px); }
  .swipe-row.swiped .row-del { transform: translateX(0); }
  .swipe-row.swiping .cat-head, .swipe-row.swiping .book-item { transition: none; }

  .book-item { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 10px 8px 22px; border: none; background: transparent; border-radius: 11px; color: var(--ink-soft); text-align: left; transition: transform, background-color, border-color, box-shadow, opacity .16s var(--ease); position: relative; cursor: pointer; }
  .book-item:hover { background: var(--surface-2); color: var(--ink); }
  .book-item.is-active { background: var(--cat-soft, var(--accent-soft)); color: var(--cat, var(--accent-ink)); font-weight: 700; }
  .entry-name { color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10px; }
  .book-emoji { display: none; }
  .book-item.is-done .mini-bar i { background: var(--amber); box-shadow: 0 0 8px rgba(253,240,212,.45); }
  .mini-bar { width: 38px; height: 5px; flex: none; border-radius: 5px; background: var(--line); overflow: hidden; }
  .mini-bar i { display: block; height: 100%; width: 0%; background: var(--cat, var(--accent)); border-radius: 5px; transition: width .4s var(--ease); box-shadow: 0 0 8px rgba(93,140,97,.35); }

  /* 左侧总类目卡片：圆角 30px，图标在上、标题在下 */
  .cat-card-row { position: relative; overflow: hidden; touch-action: pan-y; margin-bottom: 10px; }
  .cat-card { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 16px 10px 14px; border-radius: 30px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); text-align: center; transition: transform, background-color, border-color, box-shadow, opacity .18s var(--ease); cursor: pointer; }
  .cat-card:hover { transform: translateY(-2px); border-color: var(--accent); background: rgba(255,255,255,0.65); }
  .cat-card.is-active { background: linear-gradient(135deg, rgba(93,140,97,0.22), rgba(93,140,97,0.10)); border-color: rgba(93,140,97,0.45); color: var(--accent-ink); }
  .cat-card-icon { width: 58px; height: 58px; object-fit: contain; flex: none; filter: drop-shadow(0 3px 5px rgba(0,0,0,.08)); }
  .cat-card-name { width: 100%; font-size: 13.5px; font-weight: 800; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 6px; border-radius: 7px; }
  .cat-card-count { font-size: 10px; font-weight: 700; color: var(--muted); background: rgba(255,255,255,0.45); border: 1px solid var(--line-soft); padding: 2px 10px; border-radius: 20px; }
  .cat-card.is-active .cat-card-count { color: var(--accent-ink); background: rgba(255,255,255,0.35); border-color: rgba(93,140,97,0.35); }
  .swipe-row.swiped .cat-card { transform: translateX(-76px); }
  .swipe-row.swiping .cat-card { transition: none; }

  .empty-list { padding: 16px 14px; text-align: center; color: var(--muted); font-size: 13px; }

  /* 搜索结果：总类目 + 展开的子类目 */
  .search-cat { margin-bottom: 14px; }
  .search-cat-head { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); cursor: pointer; transition: transform, background-color, border-color, box-shadow, opacity .16s var(--ease); }
  .search-cat-head:hover { background: var(--surface-2); border-color: var(--accent); }
  .search-cat-head.is-active { background: var(--cat-soft, var(--accent-soft)); border-color: rgba(93,140,97,0.45); color: var(--cat, var(--accent-ink)); }
  .search-cat-icon { width: 28px; height: 28px; object-fit: contain; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.06)); }
  .search-cat-name { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-cat-count { font-size: 10px; font-weight: 700; color: var(--muted); background: rgba(255,255,255,0.45); border: 1px solid var(--line-soft); padding: 2px 8px; border-radius: 20px; flex: none; }
  .search-cat-head.is-active .search-cat-count { color: var(--cat, var(--accent-ink)); }
  .search-children { padding: 6px 0 4px 8px; display: flex; flex-direction: column; gap: 4px; }
  .search-child { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; background: transparent; border: 1px solid transparent; color: var(--ink-soft); cursor: pointer; transition: transform, background-color, border-color, box-shadow, opacity .14s var(--ease); }
  .search-child:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .search-child.is-active { background: var(--cat-soft, var(--accent-soft)); color: var(--cat, var(--accent-ink)); }
  .search-child-cover { width: 34px; height: 46px; flex: none; border-radius: 6px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; box-shadow: 0 2px 5px rgba(0,0,0,.05); }
  .search-child-cover img { width: 100%; height: 100%; object-fit: cover; }
  .search-child-ph { font-size: 18px; }
  .search-child-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .search-child-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-child-progress { height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .search-child-progress i { display: block; height: 100%; background: var(--cat, var(--accent)); border-radius: 5px; transition: width .3s var(--ease); }
  .search-mark { background: rgba(218,232,180,0.65); color: var(--ink); border-radius: 3px; padding: 0 1px; }

  /* emoji popover */
  .emoji-pop { position: fixed; z-index: 50; display: none; grid-template-columns: repeat(8, 1fr); gap: 4px; width: 296px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .emoji-pop.open { display: grid; animation: rise .2s var(--ease) both; }
  .emoji-pop button { font-size: 20px; line-height: 1; padding: 6px; border: none; background: transparent; border-radius: 9px; transition: transform, background-color, border-color, box-shadow, opacity .14s var(--ease); }
  .emoji-pop button:hover { background: rgba(93,140,97,0.18); transform: scale(1.15); }

  /* Detail */
  .detail { min-width: 0; min-height: 0; overflow-y: auto; touch-action: pan-y; }
  /* 关键：touch-action 不继承，必须覆盖 detail 内所有后代，否则在卡片/网格上右滑会被浏览器当横向滚动吞掉 */
  #detail, #detail * { touch-action: pan-y; }
  .detail-inner { max-width: 880px; margin: 0 auto; padding: 36px 36px 80px; }
  .detail-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .icon-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 13px; font-size: 13px; font-weight: 700; color: var(--ink-soft); font-family: inherit; transition: transform, background-color, border-color, box-shadow, opacity .18s var(--ease); }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent-ink); background: rgba(93,140,97,0.14); }
  .icon-btn.danger:hover { border-color: var(--coral); color: var(--coral); }
  .detail-cat { flex: 1; font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .detail-cat b { color: var(--accent-ink); font-weight: 800; }

  /* 输入标题页（添加子类目第一步） */
  .title-screen { position: relative; max-width: 480px; margin: 6vh auto 0; padding: 28px 26px 30px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 22px; text-align: center; box-shadow: var(--shadow-sm); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .title-mark { font-size: 40px; margin-bottom: 8px; cursor: pointer; user-select: none; transition: transform .15s var(--ease); }

  .home-hero .hero-content { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .home-hero .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hero-date { font-size: 13px; letter-spacing: 1px; text-transform: none; color: var(--accent-ink); font-weight: 800; }
  .hero-weather { margin: 0 52px 0 0; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--accent-soft); border: 1.5px solid var(--accent); border-radius: 20px; padding: 3px 12px; white-space: nowrap; }
  .hero-quote {

      linear-gradient(135deg, rgba(93,140,97,0.84) 0%, rgba(124,160,110,0.74) 55%, rgba(163,177,138,0.62) 100%),

  .hq-text { font-family: var(--font-display); font-size: 17px; color: #FFFBF0; line-height: 1.55; letter-spacing: .2px; text-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .hq-author { font-size: 13px; color: #fff; font-weight: 600; align-self: flex-end; text-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .home-hero h1 { display: none; }
  .hero-sub { display: none; }
  .hero-sun { transform-origin: 624px 74px; animation: floatY 7s ease-in-out infinite; }
  .daily-quote { margin: 0 0 30px; padding: 16px 22px; border-left: 4px solid rgba(242,208,107,.55); border-radius: 0 18px 18px 0; background: linear-gradient(135deg, rgba(93,140,97,0.78), rgba(163,177,138,0.66)); box-shadow: var(--shadow-xs); font-family: var(--font-display); font-size: 16px; color: #FFFBF0; animation: rise .6s var(--ease) .06s both; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .daily-quote cite { display: block; margin-top: 8px; font-style: normal; font-size: 13px; color: #fff; font-family: var(--font-ui); font-weight: 600; }
  [data-theme="dark"] .hero-quote {
    background:
      linear-gradient(135deg, rgba(93,140,97,0.70) 0%, rgba(124,160,110,0.58) 55%, rgba(163,177,138,0.46) 100%),
      linear-gradient(118deg, rgba(242,208,107,0.14) 0%, transparent 42%);
    border-color: rgba(242,208,107,0.42);
  }
  [data-theme="dark"] .daily-quote { background: linear-gradient(135deg, rgba(93,140,97,0.62), rgba(163,177,138,0.52)); border-left-color: rgba(242,208,107,.42); }
  .quote-panel { margin: 0 0 30px; padding: 16px 20px 6px; background: linear-gradient(145deg, rgba(255,255,255,0.60) 0%, rgba(251,234,225,0.40) 100%); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); animation: rise .55s var(--ease) both; }
  .quote-head { font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--accent-ink); margin-bottom: 10px; letter-spacing: .5px; }
  .quote-panel .daily-quote { margin: 0 0 10px; background: none; border: none; border-radius: 0; box-shadow: none; padding: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 32px; }
  .stat-card { background: linear-gradient(145deg, rgba(255,255,255,0.62) 0%, rgba(251,234,225,0.40) 100%); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 4px; transition: transform .28s var(--ease), box-shadow .28s var(--ease); animation: rise .55s var(--ease) both; position: relative; overflow: hidden; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .stat-card::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); opacity: .9; pointer-events: none; }
  .stat-card:hover { transform: translateY(-5px) scale(1.015) perspective(1200px) rotateX(1.2deg); box-shadow: var(--shadow-md); }
  .stat-grid .stat-card:nth-child(1) { animation-delay: .04s; background: linear-gradient(145deg, rgba(93,140,97,0.30) 0%, rgba(255,200,165,0.18) 100%); }
  .stat-grid .stat-card:nth-child(2) { animation-delay: .09s; background: linear-gradient(145deg, rgba(255,220,190,0.40) 0%, rgba(255,228,205,0.24) 100%); }
  .stat-grid .stat-card:nth-child(3) { animation-delay: .14s; background: linear-gradient(145deg, rgba(255,255,255,0.58) 0%, rgba(251,234,225,0.34) 100%); }
  .stat-grid .stat-card:nth-child(4) { animation-delay: .19s; background: linear-gradient(145deg, rgba(255,225,200,0.38) 0%, rgba(251,234,225,0.24) 100%); }
  /* 已读完书架页（封面网格） */
  .stat-card[data-open] { cursor: pointer; }
  .shelf-page { padding: 2px 0 12px; }
  .shelf-head { display: flex; align-items: center; gap: 13px; margin-bottom: 20px; padding: 12px 16px; border-radius: 16px; background: linear-gradient(135deg, rgba(93,140,97,0.92) 0%, rgba(124,160,110,0.88) 100%); box-shadow: var(--shadow-sm); }
  .shelf-back { width: 42px; height: 42px; flex: none; border-radius: 14px; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.22); display: grid; place-items: center; color: rgba(255,255,255,0.92); font-size: 24px; line-height: 1; cursor: pointer; box-shadow: var(--shadow-xs); transition: transform, background-color, border-color, box-shadow, opacity .16s var(--ease); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .shelf-back:hover { border-color: rgba(255,255,255,0.55); color: #fff; background: rgba(255,255,255,0.32); }
  .shelf-head h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 800; color: #fff; }
  .shelf-count { font-size: 13px; color: rgba(255,255,255,0.78); font-weight: 600; margin-top: 2px; }
  .shelf-titlerow { display: flex; align-items: baseline; gap: 10px; }   /* 分类页标题横排：标题 + 本数 在同一行 */
  .shelf-titlerow .shelf-count { margin-top: 0; }
  .shelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 26px 18px; }
  .shelf-card { display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: transform .22s var(--ease); }
  .shelf-card:hover { transform: translateY(-5px); }
  .shelf-cover { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 15px; overflow: hidden; background: linear-gradient(145deg, rgba(93,140,97,.22) 0%, rgba(255,228,205,.34) 100%); box-shadow: var(--shadow-sm); display: grid; place-items: center; }
  .shelf-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shelf-cover .shelf-ph { font-size: 30px; line-height: 1; }
  .shelf-name { font-size: 15px; line-height: 1.55; letter-spacing: .3px; color: var(--ink); font-weight: 700; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .upload-cover-btn {
    align-self: center; margin-top: 2px; padding: 7px 14px; font-size: 12.5px; font-weight: 700;
    color: var(--accent-ink); background: rgba(93,140,97,.14); border: 1px solid rgba(93,140,97,.4);
    border-radius: 999px; cursor: pointer; transition: transform, background-color, border-color, box-shadow, opacity .16s var(--ease); -webkit-tap-highlight-color: transparent;
  }
  .upload-cover-btn:active { background: rgba(93,140,97,.26); filter: brightness(0.97); }
  .shelf-empty { padding: 56px 12px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; }
  /* 分类页末尾：与书籍卡片同尺寸的虚线「＋」添加框 */
  .shelf-add { cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
  .shelf-add .shelf-add-box {
    width: 100%; aspect-ratio: 3 / 4; border-radius: 15px;
    border: 2px dashed var(--line-soft, #d8c8c2);
    background: rgba(255,255,255,0.30);
    display: grid; place-items: center;
    color: #b6a99e; font-size: 42px; font-weight: 200; line-height: 1;
    transition: transform, background-color, border-color, box-shadow, opacity .16s var(--ease); -webkit-tap-highlight-color: transparent;
  }
  .shelf-add:active .shelf-add-box { background: rgba(93,140,97,.10); border-color: rgba(93,140,97,.5); }
  .stat-num { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--accent-ink); line-height: 1; }
  .stat-lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .home-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .list-card { background: linear-gradient(145deg, rgba(255,255,255,0.60) 0%, rgba(251,234,225,0.38) 100%); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow-sm); animation: rise .55s var(--ease) both; transition: box-shadow .28s var(--ease), transform .28s var(--ease); position: relative; overflow: hidden; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .list-card::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); opacity: .9; pointer-events: none; }
  .list-card:hover { box-shadow: var(--shadow-md); transform: translateY(-5px) scale(1.015) perspective(1200px) rotateX(1.2deg); }
  .home-cols .list-card:nth-child(1) { animation-delay: .12s; background: linear-gradient(145deg, rgba(93,140,97,0.28) 0%, rgba(251,234,225,0.28) 100%); }
  .home-cols .list-card:nth-child(2) { animation-delay: .18s; background: linear-gradient(145deg, rgba(255,200,165,0.30) 0%, rgba(255,255,255,0.26) 100%); }
  .list-card h2 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0 0 14px; }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 11px; cursor: pointer; transition: background .16s var(--ease); animation: rise .45s var(--ease) both; }
  .list-card .list-row:nth-child(2) { animation-delay: .04s; }
  .list-card .list-row:nth-child(3) { animation-delay: .08s; }
  .list-card .list-row:nth-child(4) { animation-delay: .12s; }
  .list-card .list-row:nth-child(5) { animation-delay: .16s; }
  .list-card .list-row:nth-child(6) { animation-delay: .20s; }
  .list-row:hover { background: rgba(255,255,255,0.45); }
  .list-row .lr-name { flex: 1; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .lr-meta { font-size: 12px; color: var(--muted); flex: none; font-weight: 600; }
  .list-empty { color: var(--muted); font-size: 13px; padding: 10px 4px; }

  .welcome { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; color: var(--muted); }
  .welcome-mark { width: 88px; height: 88px; border-radius: 26px; margin-bottom: 22px; display: grid; place-items: center; font-size: 42px; background: linear-gradient(150deg, #A3B18A, #6A9E6E); box-shadow: var(--shadow-lg), 0 0 30px rgba(93,140,97,.35); }
  .welcome h2 { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--ink); margin: 0 0 8px; }
  .welcome p { margin: 0 0 22px; max-width: 320px; font-size: 14px; }
  .welcome .hint { font-size: 12.5px; margin-top: 18px; font-weight: 600; }

  .sidebar-toggle { display: none; position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); z-index: 40; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-md); align-items: center; justify-content: center; touch-action: manipulation; cursor: pointer; }
  .sidebar-toggle svg { width: 20px; height: 20px; }
  .scrim { display: none; position: fixed; inset: 0; z-index: 19; background: rgba(45,58,66,.22); backdrop-filter: blur(3px); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; z-index: 20; top: 0; left: 0; bottom: 0; width: 60vw; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateX(-100%); transition: transform .32s var(--ease); box-shadow: var(--shadow-lg); }
    .app.nav-open .sidebar { transform: translateX(0); }
    .app.nav-open .scrim { display: block; }
    .sidebar-toggle { display: flex; }
    .app.home-view .sidebar-toggle { display: none; }
    .app.home-view .detail-inner { padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(70px + env(safe-area-inset-bottom, 0px)); }
    .app.home-view .home-topbar { display: flex; }
    .detail-inner { padding: calc(76px + env(safe-area-inset-top, 0px)) 20px calc(70px + env(safe-area-inset-bottom, 0px)); }
    .grid { grid-template-columns: 1fr; }
    .card.span2 { grid-column: auto; }
    .progress-row { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .home-cols { grid-template-columns: 1fr; }
  }
  @media (min-width: 861px) { .scrim { display: none !important; } }
  /* undo toast */
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); z-index: 60; display: none; align-items: center; gap: 14px; padding: 12px 14px 12px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .25s var(--ease), transform .25s var(--ease); max-width: 92vw; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .toast.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-msg { font-size: 13.5px; font-weight: 700; color: var(--ink-soft); }
  .toast-undo { border: none; background: var(--accent); color: #fff; font-weight: 800; font-family: inherit; padding: 8px 16px; border-radius: 11px; font-size: 13px; transition: transform, background-color, border-color, box-shadow, opacity .18s var(--ease); }
  .toast-undo:hover { background: var(--accent-2); }

  /* daily background photo */
  .bg-photo { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; background-repeat: no-repeat; opacity: 0; transition: opacity .5s ease, background-image .4s ease; }
  .bg-tint { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: transparent; }
  [data-theme="dark"] .bg-tint { background: transparent; }
  /* 双击背景弹出的小菜单 */
  .bg-menu { position: fixed; z-index: 56; display: none; flex-direction: column; gap: 2px; padding: 8px; min-width: 176px; background: var(--surface); border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow-lg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .bg-menu.show { display: flex; }
  .bg-menu button { display: flex; align-items: center; gap: 9px; width: 100%; border: none; background: transparent; color: var(--ink); font-size: 14px; font-weight: 700; font-family: inherit; padding: 11px 12px; border-radius: 11px; text-align: left; cursor: pointer; transition: transform, background-color, border-color, box-shadow, opacity .15s var(--ease); }
  .bg-menu button:hover { background: rgba(93,140,97,0.16); color: var(--accent-ink); }

  /* category theme color */
  .cat-emoji { background: rgba(255,255,255,0.10); }
  .book-item.is-active { border-left: 3px solid var(--cat, var(--accent)); background: var(--cat-soft, var(--accent-soft)); }
  .book-item .mini-bar i { background: var(--cat, var(--accent)); }
  .detail-cat { color: var(--ink-soft); }
  .detail-cat b { color: var(--accent-ink); }
  .detail-inner .num { background: var(--cat-soft, rgba(93,140,97,0.18)); }
  .cat-color { display: none; }
  .color-pop { display: none; }
  .color-grid { display: none; }
  .color-sw { display: none; }

  /* recycle bin */
  .nav-trash { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-soft); font-weight: 700; font-size: 14px; transition: background .16s var(--ease), color .16s var(--ease); }
  .nav-trash:hover { background: var(--surface-2); color: var(--ink); }
  .nav-trash.is-active { background: var(--accent-soft); color: var(--accent-ink); }
  /* 列表底部的添加书籍按钮（位于回收站上方） */
  .add-book-row { margin: 10px 2px 6px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
  .add-book-btn { width: 100%; }
  .trash-ico { font-size: 16px; }
  .trash-badge { margin-left: auto; background: var(--coral-soft); color: var(--coral); font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 10px; }
  .trash-actions { margin: 4px 0 14px; }
  .trash-row { gap: 10px; }
  .lr-icon { font-size: 18px; }
  .icon-btn.small { padding: 6px 12px; font-size: 12.5px; }
  .danger-outline { color: var(--coral); border: 1px solid var(--coral); background: transparent; }
  .danger-outline:hover { background: var(--coral-soft); }
  .home-hero.simple h1 { font-family: var(--font-display); font-size: clamp(26px,4vw,36px); margin: 0; }
  .home-hero.simple { margin-bottom: 18px; }

  /* check-in - 青色液态玻璃 */
  .checkin-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 34px; background: linear-gradient(145deg, rgba(93,140,97,0.28) 0%, rgba(255,200,165,0.18) 100%); }
  .checkin-left { display: flex; flex-direction: column; gap: 8px; }
  .checkin-streak { font-size: 16px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .checkin-streak b { font-size: 26px; color: var(--accent-ink); font-family: var(--font-display); line-height: 1; }
  .flame { font-size: 22px; }
  .week-dots { display: flex; gap: 7px; }
  .week-dots .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); }
  .week-dots .dot.on { background: linear-gradient(135deg, #A3B18A, #6A9E6E); border-color: #A3B18A; box-shadow: 0 0 0 3px rgba(93,140,97,.18), 0 0 12px rgba(93,140,97,.40); }
  .week-dots .dot.today { outline: 2px dashed var(--accent-2); outline-offset: 2px; }

  /* motion */
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes shimmer { from { background-position: -180% 0; } to { background-position: 180% 0; } }

  /* ===== 液态玻璃 / 3D 透明 ===== */
  .app { perspective: 1700px; }
  .sidebar, .card, .nav-home, .stat-card, .list-card, .checkin-card,
  .daily-quote, .cover, .emoji-pop, .toast, .search-box, .btn-ghost,
  .icon-btn, .session-block, .progress-bar, .home-hero, .modal, .nav-row, .cat-head {
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-color: var(--line);
  }
  .sidebar { box-shadow: var(--shadow-lg); }
  .card { transform: translateZ(0); will-change: transform; }
  .card:hover { transform: translateY(-5px) scale(1.01) perspective(1200px) rotateX(1.2deg); box-shadow: var(--shadow-lg); border-color: rgba(255,255,255,.85); }
  .stat-card:hover, .list-card:hover { transform: translateY(-5px) scale(1.015) perspective(1200px) rotateX(1.2deg); box-shadow: var(--shadow-md); }
  .home-hero { box-shadow: var(--shadow-lg); }
  .search-box { background: transparent; }
  .cat-count { background: var(--surface); }
  .book-item.is-active { backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }

  /* 标题：默认手指光标，双击进入编辑后变为文本光标 */
  .app-title { cursor: pointer; transition: opacity .2s var(--ease); }
  .app-title:hover { opacity: .82; }
  .app-title.editing { cursor: text; opacity: 1; }
  .app-title.renameable::after { content: " 📝"; opacity: 0; font-size: .5em; vertical-align: middle; transition: opacity .2s var(--ease); }
  .app-title.renameable:hover::after { opacity: .7; }
  .brand-text h1.app-title { font-size: 18px; }
  .home-hero h1.app-title { font-size: clamp(30px, 5vw, 46px); }

  /* ===== 成熟 App 风格升级 ===== */
  /* 品牌 logo 区 */
  .brand { padding: 18px 18px 14px; align-items: center; }
  .avatar { width: 42px; height: 42px; border-radius: 13px; font-size: 21px; box-shadow: 0 6px 16px rgba(93,140,97,.30), 0 0 22px rgba(93,140,97,.22), inset 0 1px 0 rgba(255,255,255,.55); }
  .brand-text h1 { font-size: 16.5px; }
  .brand-text p { font-size: 10px; letter-spacing: 1.3px; }

  /* 分组标题 */
  .nav-section { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 8px; }
  .nav-section-title { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
  .nav-section-sub { font-size: 13px; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 20px; padding: 3px 10px; }

  /* 主按钮（CTA） */
  .btn-primary { width: 100%; background: linear-gradient(150deg, #6A9E6E, #5D8C61); color: #fff; box-shadow: 0 8px 22px rgba(93,140,97,.32), 0 0 24px rgba(93,140,97,.22), inset 0 1px 0 rgba(255,255,255,.45); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(93,140,97,.38), 0 0 32px rgba(93,140,97,.28), inset 0 1px 0 rgba(255,255,255,.6); }
  .btn-primary:active { transform: translateY(0); }

  /* 底部操作按钮（已读完板块已移除，四个按钮落到底部） */
  .sidebar > .data-actions:last-child { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }

  /* 数据导出/导入 */
  .data-actions { display: flex; gap: 10px; padding: 12px 16px 6px; }
  .sidebar > .data-actions:first-child { border-top: 1px solid var(--line-soft); margin-top: 4px; padding-top: 14px; }
  .sidebar > .data-actions:last-child { padding-bottom: 16px; }
  .data-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 10px; border-radius: 12px; font-size: 13px; font-weight: 700; font-family: inherit; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line-soft); cursor: pointer; transition: transform, background-color, border-color, box-shadow, opacity .18s var(--ease); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .data-btn:hover { color: var(--accent-ink); border-color: var(--accent); background: rgba(93,140,97,.16); }
  .data-btn:active { transform: translateY(1px); }

  /* 导航项层次 */
  .nav-home { padding: 9px 13px; font-weight: 700; }
  .nav-home .home-ic { width: 20px; height: 20px; }
  .cat-head { padding: 9px 10px; font-weight: 700; }
  .book-item { padding: 10px 11px 10px 32px; }
  .cat-head:hover { background: rgba(255,255,255,0.08); }

  /* 统计卡：图标徽章 + 横向布局 */
  .stat-card { flex-direction: row; align-items: center; gap: 14px; padding: 16px 18px; }
  .stat-ic { width: 40px; height: 40px; flex: none; border-radius: 13px; display: grid; place-items: center; font-size: 20px; background: rgba(93,140,97,0.16); border: 1px solid rgba(93,140,97,0.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 14px rgba(45,58,66,.10); }
  .stat-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat-num { font-size: 27px; line-height: 1; }

  /* 列表卡标题图标 + 列表行缩略 */
  .list-card h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 14px; }
  .lc-ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; background: rgba(93,140,97,0.16); border: 1px solid rgba(93,140,97,0.26); }
  .lr-thumb { width: 36px; height: 46px; flex: none; border-radius: 9px; overflow: hidden; display: grid; place-items: center; font-size: 18px; background: var(--surface-2); border: 1px solid var(--line); color: var(--accent-ink); }
  .lr-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .list-row { gap: 12px; padding: 9px 10px; }
  .lr-name { font-size: 14px; }

  /* 卡片顶部白色高光常显 + 3D 透视 */
  .app { perspective: 1400px; }
  .sidebar, .card, .nav-home, .stat-card, .list-card, .checkin-card,
  .daily-quote, .cover, .emoji-pop, .toast, .search-box, .btn-ghost,
  .icon-btn, .session-block, .progress-bar, .home-hero, .modal, .nav-row, .cat-head {
    transform-style: preserve-3d;
  }
  /* 卡片白色高光已统一用 ::before 实现 */

  /* 图标按钮精致化 */
  .icon-btn { box-shadow: var(--shadow-xs); }
  .icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }

  /* 滚动条更精致 */
  .cat-list::-webkit-scrollbar, .detail-inner::-webkit-scrollbar { width: 8px; }
  .cat-list::-webkit-scrollbar-thumb, .detail-inner::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  .cat-list::-webkit-scrollbar-thumb:hover, .detail-inner::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* 空状态图标化 */
  .empty-list, .list-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 14px; }
  .empty-list::before, .list-empty::before { content: "📭"; font-size: 24px; opacity: .65; }

  /* 已读完统计用柔粉色强调 */
  .stat-grid .stat-card:nth-child(2) .stat-ic { background: rgba(249,230,184,0.18); border-color: rgba(249,230,184,0.30); }
  .stat-grid .stat-card:nth-child(2) .stat-num { color: var(--pink-ink); text-shadow: 0 0 18px rgba(249,230,184,.35); }
  .pill-pink { background: var(--pink-soft); color: var(--pink-ink); }
  .stat-card:hover, .list-card:hover { transform: translateY(-5px) scale(1.015) perspective(1200px) rotateX(1.2deg); box-shadow: var(--shadow-md); }

  /* 详情页分区标题更精致 */
  .card h2 .num { box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }

  /* ===================================================================
     液态玻璃边框 v20
     1) 更柔的大圆角
     2) 1px 半透明高光边（融入背景，非贴上去的线框）
     3) 边框上方一条白色反光带
     4) 左侧边缘蓝紫 → 橙黄的彩虹色散
     =================================================================== */

  /* --- 1. 主面板：圆角 + 融合式外光 --- */
  .card, .cover, .stat-card, .list-card, .session-block,
  .note-sheet, .quote-panel, .toast, .home-hero {
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.26);
    isolation: isolate;
    box-shadow:
      0 20px 46px rgba(45,58,66,.10),
      0 3px 12px rgba(45,58,66,.05),
      inset 0 1px 1px rgba(255,255,255,.50);
  }
  .quote-panel { position: relative; }
  .note-sheet, .quote-panel { backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); }

  /* --- 2. 顶部白色反光带（玻璃受光面）--- */
  .card::before, .cover::before, .stat-card::before, .list-card::before,
  .session-block::before, .note-sheet::before, .quote-panel::before, .toast::before, .home-hero::before {
    content: "";
    position: absolute;
    left: 5%; right: 5%; top: 1px;
    height: 44%;
    z-index: -1;
    pointer-events: none;
    opacity: .95;
    border-radius: 999px 999px 42% 42% / 100% 100% 26% 26%;
    background: linear-gradient(180deg,
      rgba(255,255,255,.92) 0%,
      rgba(255,255,255,.50) 32%,
      rgba(255,255,255,.16) 64%,
      rgba(255,255,255,0)  100%);
  }
  .card:hover::before { opacity: 1; }

  /* --- 3+4. 边框环：白色高光边 + 左上蓝紫 / 左下橙黄色散 --- */
  .card::after, .cover::after, .stat-card::after, .list-card::after,
  .session-block::after, .note-sheet::after, .quote-panel::after, .toast::after, .home-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    border-radius: inherit;
    padding: 1.2px;
    pointer-events: none;
    box-shadow: none;
    background:
      linear-gradient(118deg,
        rgba(118,102,246,.92)  0%,
        rgba(152,140,255,.70)  5%,
        rgba(188,208,255,.40) 11%,
        rgba(255,255,255,0)   21%),
      linear-gradient(28deg,
        rgba(255,156,68,.92)   0%,
        rgba(255,198,122,.64)  6%,
        rgba(255,230,180,.30) 12%,
        rgba(255,255,255,0)   22%),
      linear-gradient(180deg,
        rgba(255,255,255,.92)  0%,
        rgba(255,255,255,.52) 44%,
        rgba(255,255,255,.32) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
  }

  /* --- 5. 小控件：同款玻璃边（弱化色散）--- */
  .icon-btn, .btn-ghost, .cover-btn, .nav-home, .search-box, .btn-add-row {
    position: relative;
    isolation: isolate;
    border-radius: 16px;
    border-style: solid;
    border-color: rgba(255,255,255,.30);
  }
  .icon-btn::before, .btn-ghost::before, .cover-btn::before,
  .nav-home::before, .search-box::before, .btn-add-row::before {
    content: "";
    position: absolute;
    left: 7%; right: 7%; top: 1px;
    height: 46%;
    z-index: -1;
    pointer-events: none;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.12) 78%, transparent);
  }
  .icon-btn::after, .btn-ghost::after, .cover-btn::after,
  .nav-home::after, .search-box::after, .btn-add-row::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: inherit;
    padding: 1px;
    pointer-events: none;
    background:
      linear-gradient(125deg, rgba(93,140,97,.58) 0%, rgba(163,177,138,.26) 9%, rgba(255,255,255,0) 21%),
      linear-gradient(35deg,  rgba(242,208,107,.58)  0%, rgba(232,245,220,.24) 9%, rgba(255,255,255,0) 21%),
      linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.34));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
  }

  /* --- 6. 侧边栏右缘的色散光边 --- */
  .sidebar { border-right-color: rgba(255,255,255,.34); }
  .sidebar::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: -1px;
    width: 2px;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(93,140,97,.55)  0%,
      rgba(163,177,138,.34) 18%,
      rgba(255,255,255,.58) 46%,
      rgba(232,245,220,.38) 76%,
      rgba(242,208,107,.55) 100%);
  }

  /* --- 7. 进度条也做成玻璃胶囊 --- */
  .progress-bar { border-color: rgba(255,255,255,.34); box-shadow: inset 0 1px 2px rgba(45,58,66,.08), 0 1px 0 rgba(255,255,255,.55); }

  /* --- 8. 暗色主题：减弱白光，保留色散 --- */
  [data-theme="dark"] .card, [data-theme="dark"] .cover,
  [data-theme="dark"] .stat-card, [data-theme="dark"] .list-card,
  [data-theme="dark"] .session-block, [data-theme="dark"] .note-sheet,
  [data-theme="dark"] .quote-panel, [data-theme="dark"] .toast {
    border-color: rgba(255,255,255,.10);
    box-shadow: 0 20px 46px rgba(0,0,0,.34), inset 0 1px 1px rgba(255,255,255,.10);
  }
  [data-theme="dark"] .card::before, [data-theme="dark"] .cover::before,
  [data-theme="dark"] .stat-card::before, [data-theme="dark"] .list-card::before,
  [data-theme="dark"] .session-block::before, [data-theme="dark"] .note-sheet::before,
  [data-theme="dark"] .quote-panel::before, [data-theme="dark"] .toast::before {
    background: linear-gradient(180deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.10) 40%, rgba(255,255,255,0) 100%);
  }
  [data-theme="dark"] .card::after, [data-theme="dark"] .cover::after,
  [data-theme="dark"] .stat-card::after, [data-theme="dark"] .list-card::after,
  [data-theme="dark"] .session-block::after, [data-theme="dark"] .note-sheet::after,
  [data-theme="dark"] .quote-panel::after, [data-theme="dark"] .toast::after {
    background:
      linear-gradient(118deg, rgba(93,140,97,.85) 0%, rgba(163,177,138,.55) 6%, rgba(255,255,255,0) 20%),
      linear-gradient(28deg,  rgba(242,208,107,.85)  0%, rgba(232,245,220,.50) 6%, rgba(255,255,255,0) 20%),
      linear-gradient(180deg, rgba(255,255,255,.36) 0%, rgba(255,255,255,.14) 50%, rgba(255,255,255,.08) 100%);
  }
  [data-theme="dark"] .shelf-cover { background: linear-gradient(145deg, rgba(140,179,105,.26) 0%, rgba(232,245,220,.14) 100%); }
  [data-theme="dark"] .shelf-back { background: rgba(255,255,255,.08); }
  [data-theme="dark"] .upload-cover-btn { background: rgba(140,179,105,.22); border-color: rgba(140,179,105,.5); }
  [data-theme="dark"] .cat-card { background: rgba(255,255,255,0.06); }
  [data-theme="dark"] .cat-card:hover { background: rgba(255,255,255,0.10); }
  [data-theme="dark"] .cat-card.is-active { background: linear-gradient(135deg, rgba(140,179,105,0.28), rgba(93,140,97,0.16)); }
  [data-theme="dark"] .cat-card-count { background: rgba(0,0,0,0.25); }

  /* 手机端：侧栏占 3/5 屏幕，品牌区图标置顶、文字横排居中 */
  @media (max-width: 860px) {
    .brand { flex-direction: column; gap: 8px; padding: 16px 14px 12px; text-align: center; }
    .avatar { width: 56px; height: 56px; border-radius: 16px; font-size: 28px; }
    .brand-text { flex: none; width: 100%; }
    .brand-text h1 { font-size: 17px; }
    .brand-text p { font-size: 11px; letter-spacing: 1px; }
    .search { padding: 12px 12px 6px; }
    .sidebar-actions { padding: 12px 12px 4px; }
    .nav-section { padding: 12px 14px 8px; }
    .nav-home { padding: 8px 11px; }
    .cat-head { padding: 8px 10px; }
    .cat-list { padding: 8px 10px 16px; }
    .data-actions { padding: 12px 14px 6px; }
    .nav-trash { padding: 10px 10px; }
  }

  /* ===== 蜡笔小新风格：卡片蜡笔描边 + 角色贴纸 ===== */
  .stat-card, .list-card, .card, .quote-panel, .welcome, .title-screen, .nav-tool {
    border: 2.5px solid var(--ink-line);
  }
  .stat-card, .list-card, .card, .quote-panel, .welcome, .title-screen { position: relative; }
  .stat-grid .stat-card:nth-child(1) { background: linear-gradient(145deg, rgba(242,208,107,0.32) 0%, rgba(214,238,228,0.22) 100%); }
  .stat-grid .stat-card:nth-child(2) { background: linear-gradient(145deg, rgba(216,124,95,0.20) 0%, rgba(255,255,255,0.30) 100%); }
  .home-cols .list-card:nth-child(1) { background: linear-gradient(145deg, rgba(216,124,95,0.16) 0%, rgba(214,238,228,0.24) 100%); }

  /* 角色贴纸：板块右上角空白处的动漫蜡笔小新贴纸 */
  .crayon-sticker { position: absolute; top: 6px; right: 8px; width: 52px; height: 52px; object-fit: contain; pointer-events: none; z-index: 4; transform: rotate(-7deg); filter: drop-shadow(0 3px 5px rgba(58,46,40,.22)); animation: stickerWobble 4.5s ease-in-out infinite; }
  .stat-card .crayon-sticker { width: 38px; height: 38px; top: 5px; right: 6px; }
  .home .crayon-sticker { opacity: .85; }
  @keyframes stickerWobble { 0%,100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(-3deg) translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .crayon-sticker { animation: none; } }

  /* 侧栏底部工具行（导出/导入/复制） */
  .nav-tool { display: flex; align-items: center; gap: 10px; padding: 11px 12px; margin-top: 4px; border-radius: 14px; background: var(--surface); color: var(--ink-soft); font-size: 13px; font-weight: 700; cursor: pointer; transition: transform, background-color, border-color, box-shadow, opacity .16s var(--ease); }
  .nav-tool:hover { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }
  .nav-tool:active { transform: translateY(1px); }
  .nav-tool .nt-ic { font-size: 16px; }

  /* 常驻版本角标：一眼确认当前加载的是哪个版本（PWA 旧版缓存排查用） */
  .ver-badge { position: fixed; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); z-index: 60; font-size: 10px; line-height: 1; color: var(--muted); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px; padding: 2px 7px; opacity: .6; pointer-events: none; letter-spacing: .2px; }
</style>

<script>
(function () {
  "use strict";

  var STORE_KEY = "reading-workbench-v3";
  var CATEGORY_COLORS = ["#5D8C61","#A3B18A","#6A9E6E","#81B29A","#D87C5F","#F2D06B","#98C1D9","#F5B7B1","#E8C4A0","#7DA87B"];
  var EMOJIS = ["📚","📖","💡","🧠","🎯","🛠️","🎨","🎵","🎬","✍️","📝","🔍","🌟","🌿","🌈","☕","🍃","🔥","🚀","🌸","🐱","🍀","⭐","💎","🌊","🎮","📷","💻","🧘","🌞","🌙","🍰"];

  /* 蜡笔小新角色贴纸（内联 SVG，描边随主题 crayon 色） */
  /* 从用户提供图片抠出的动漫风蜡笔小新贴纸（PNG 透明底） */
  var STICKER_PNG = {
    shiro: "assets/stickers/shin_life_1_0.png",   // 读书小白
    misae: "assets/stickers/shin_life_0_1.png",   // 吹泡泡

  function highlightMatch(text, q) {
    if (!q || !text) return esc(text || "");
    var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\\\]/g, '\\$&') + ")", "gi");
    return text.split(re).map(function (part, i) {
      return (i % 2 === 1) ? '<mark class="search-mark">' + esc(part) + '</mark>' : esc(part);
    }).join("");
  }

  function renderSidebar() {
    var q = (data.search || "").trim().toLowerCase();
    var html = "";
    if (!q) {
      /* 默认侧栏：首页 + 总类目卡片 + 工具 */
      data.nodes.forEach(function (n) {
        if (n.type === "home") {
          var ha = n.id === data.selectedId ? " is-active" : "";
          html += '<div class="nav-home' + ha + '" data-act="select" data-node="' + n.id + '">';
          html += '<span style="font-size:18px">' + esc(n.emoji || "🏠") + '</span>';
          html += '<span class="renameable nav-wrap"><input class="nav-name" data-act="rename" data-node="' + n.id + '" value="' + esc(n.name) + '" readonly /><em class="rename-hint">✏️</em></span>';
          html += "</div>";
          return;
        }
        if (n.type === "category") {
          var isActive = n.id === data.selectedId;
          if (!isActive && n.children) isActive = n.children.some(function (b) { return b.id === data.selectedId; });
          var activeClass = isActive ? " is-active" : "";
          var iconSrc = esc(n.icon || CATEGORY_ICONS[0]);
          html += '<div class="cat-card-row swipe-row">';
          html += '<div class="cat-card' + activeClass + '" data-act="select" data-node="' + n.id + '" style="--cat:' + catColor(n) + ';--cat-soft:' + softColor(catColor(n)) + '">';
          html += '<img class="cat-card-icon" src="' + iconSrc + '" alt="" aria-hidden="true" />';
          html += '<span class="renameable nav-wrap"><input class="cat-card-name nav-name" data-act="rename" data-node="' + n.id + '" value="' + esc(n.name) + '" readonly /><em class="rename-hint">✏️</em></span>';
          html += '<span class="cat-card-count">' + n.children.length + " 本</span>";
          html += '</div><button class="row-del" data-act="del-cat" data-node="' + n.id + '">删除</button></div>';
        }
      });
      html += '<div class="add-book-row"><button class="btn btn-primary" data-act="add-category">＋ 添加书籍📚</button></div>';
      html += '<div class="nav-trash' + (data.selectedId === "trash" ? " is-active" : "") + '" data-act="trash" data-node="trash">' +
        '<span class="trash-ico">🗑️</span><span>回收站</span>' +
        (data.trash && data.trash.length ? '<span class="trash-badge">' + data.trash.length + "</span>" : "") +
        "</div>";
      html += '<div class="nav-tool" data-act="export"><span class="nt-ic">⬇</span><span>导出备份</span></div>';
      html += '<div class="nav-tool" data-act="import"><span class="nt-ic">⬆</span><span>导入恢复</span></div>';
      html += '<div class="nav-tool" data-act="copy"><span class="nt-ic">🔗</span><span>复制地址</span></div>';
    } else {
      /* 搜索模式：显示总类目 + 展开的匹配子类目 */
      var hasResult = false;
      data.nodes.forEach(function (n) {
        if (n.type !== "category") return;
        var catMatch = n.name.toLowerCase().indexOf(q) > -1;
        var matched = (n.children || []).filter(function (b) { return b.name.toLowerCase().indexOf(q) > -1; });
        if (!catMatch && !matched.length) return;
        hasResult = true;
        var iconSrc = esc(n.icon || CATEGORY_ICONS[0]);
        var catStyle = ' style="--cat:' + catColor(n) + ';--cat-soft:' + softColor(catColor(n)) + '"';
        html += '<div class="search-cat">';
        html += '<div class="search-cat-head' + (n.id === data.selectedId ? " is-active" : "") + '" data-act="select" data-node="' + n.id + '"' + catStyle + '>';
        html += '<img class="search-cat-icon" src="' + iconSrc + '" alt="" aria-hidden="true" />';
        html += '<span class="search-cat-name">' + highlightMatch(n.name, q) + '</span>';
        html += '<span class="search-cat-count">' + n.children.length + ' 本</span>';
        html += '</div>';
        if (matched.length) {
          html += '<div class="search-children">';
          matched.forEach(function (b) {
            var pct = progressOf(b);
            var cover = b.cover
              ? '<img src="' + esc(b.cover) + '" alt="" />'
              : '<span class="search-child-ph">' + esc(defaultEmoji(b.name)) + '</span>';
            html += '<div class="search-child' + (b.id === data.selectedId ? " is-active" : "") + '" data-act="select" data-node="' + b.id + '">';
            html += '<div class="search-child-cover">' + cover + '</div>';
            html += '<div class="search-child-info">';
            html += '<div class="search-child-name">' + highlightMatch(b.name, q) + '</div>';
            html += '<div class="search-child-progress"><i style="width:' + pct + '%"></i></div>';
            html += '</div></div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
      if (!hasResult) html = '<div class="empty-list">未找到「' + esc(q) + '」相关书籍</div>';
    }
    if (!html) html = '<div class="empty-list">暂无内容</div>';
    catList.innerHTML = html;
  }
  function setSidebarActive(id) {
    catList.querySelectorAll(".is-active").forEach(function (el) { el.classList.remove("is-active"); });
    var row = catList.querySelector('[data-act="select"][data-node="' + id + '"]');
    if (row) row.classList.add("is-active");
  }

  // 导航历史栈：记录 selectedId 的变化，供「右滑返回 / 返回键」回到上一个界面
  var navStack = [];
  var lastRenderedId = null;
  var isBackNav = false;
  function isMobile() { return window.matchMedia("(max-width: 860px)").matches; }
  function resetDetailTransform() { try { detail.style.transition = ""; detail.style.transform = ""; } catch (e) {} }
  function goBack() {
    var node = findNode(data.selectedId);
    // 分类页：点击左上角返回键保持当前页面不变，并展开左侧栏
    if (node && node.type === "category") {
      setSidebarActive(data.selectedId);
      renderSidebar();
      if (isMobile()) openNav();
      resetDetailTransform();
      return;
    }
    // 书籍/子类目：优先返回其所属「分类页」
    if (node && node.type && node.type !== "category" && node.type !== "home") {
      var p = findParent(data.selectedId);
      if (p) {
        data.selectedId = p.id; isBackNav = true;
        save(); setSidebarActive(p.id); renderSidebar(); renderDetail();
        if (isMobile()) closeNav();
        resetDetailTransform();
        return;
      }
    }
    if (navStack.length === 0) {
      data.selectedId = "home"; isBackNav = true;
      save(); setSidebarActive("home"); renderSidebar(); renderDetail();
      if (isMobile()) openNav();   // 回到首页：展开左侧栏
      resetDetailTransform();
      return;
    }
    var prev = navStack.pop();
    isBackNav = true;
    data.selectedId = prev;
    save();
    setSidebarActive(prev);
    renderDetail();
    if (isMobile()) { if (prev === "home") openNav(); else closeNav(); }
    resetDetailTransform();
  }

  function renderDetail() {
    // 记录导航历史：进入新界面时，把「进入前的界面」压入栈
    var newId = data.selectedId || "home";
    if (newId !== lastRenderedId) {
      if (!isBackNav && lastRenderedId !== null) navStack.push(lastRenderedId);
      isBackNav = false;
      lastRenderedId = newId;
    }
    var node = findNode(data.selectedId);
    var isHome = data.selectedId === "home" || (node && node.type === "home");
    app.classList.toggle("home-view", isHome);
    if (data.selectedId === "trash") { renderTrash(); return; }
    if (data.selectedId === "__done_shelf__") { renderDoneShelf(); return; }
    if (!node) { renderWelcome(); return; }
    if (node.type === "home") { renderHome(); return; }
    if (node.type === "category") { renderCategoryPage(node); return; }
    renderItem(node);
  }

  function renderItem(b) {
    var parent = findParent(b.id);

    var pct = progressOf(b), done = isDone(b);
    var meta = "";
    if (done) meta += '<span class="pill pill-pink">✓ 已读完' + (b.finishedDate ? " · " + esc(b.finishedDate) : "") + "</span>";
    else if (b.pages > 0) meta += '<span class="pill pill-accent">已读 ' + pct + "%</span>";
    else meta += '<span class="pill pill-muted">未登记页数</span>';
    if (b.readCount > 0) meta += '<span class="pill pill-muted">读了 ' + b.readCount + " 次</span>";

    var html =
      '<div class="detail-inner" style="--cat:' + cc + ';--cat-soft:' + softColor(cc) + '">' +
        '<div class="detail-top">' +
          '<button class="icon-btn" id="backBtn">‹ 返回</button>' +
          '<div class="detail-cat">分类：<b>' + esc(parent ? parent.name : "—") + "</b></div>" +
          '<button class="icon-btn danger" id="delBook">🗑 删除</button>' +
        "</div>" +
        '<div class="detail-head">' +
          '<div class="head-meta" id="headMeta">' + meta + "</div>" +
        "</div>" +
        '<div class="grid">' +
          flowHTML(b) +
          coreBoxesHTML(b) +
          timelineHTML(b) +
        "</div>" +
        extrasHTML(b) +
        '<button class="btn btn-accent add-extra" id="addExtra">＋ 添加标题及方框</button>' +

  function renderHome() {
    var items = allItems();
    var done = items.filter(isDone);
    var ongoing = items.filter(function (b) { return !isDone(b); });
    var totalReads = items.reduce(function (s, b) { return s + (b.readCount || 0); }, 0);
    var dateStr = new Date().toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

    if (!weatherRequested) { weatherRequested = true; loadWeather(); }

    var topBar =
      '<div class="home-topbar">' +
        '<button class="topbar-menu" id="homeMenuBtn" aria-label="打开导航">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>' +
        "</button>" +
        '<span class="topbar-title renameable" id="homeTitle" title="双击修改标题">' + esc(getAppTitle()) + "</span>" +
      "</div>";
    var html =
      '<div class="detail-inner"><div class="home">' +
        topBar +
        heroHTML(dateStr) +
        '<div class="stat-grid">' +
          statCard(done.length, "已读完", "", "himawari", "__done_shelf__") +
          statCard(totalReads, "累计阅读次数", "", "kazama") +
        "</div>" +

          listCard("继续阅读", ongoing, false, "boo") +

    var at = document.getElementById("appTitle");
    if (at) makeEditable(at, getAppTitle, setAppTitle);
    applyHeroBackground();
    var hh = document.getElementById("homeHero");
    if (hh) {
      var hClicks = 0, hTimer = null;
      hh.addEventListener("click", function (e) {
        hClicks++;
        clearTimeout(hTimer);
        hTimer = setTimeout(function () { hClicks = 0; }, 650);

    }
    detail.querySelectorAll("[data-open]").forEach(function (el) {
      el.addEventListener("click", function () {
        data.selectedId = el.getAttribute("data-open");

  function statCard(num, lbl, icon, charName, open) {
    var ic = icon ? '<span class="stat-ic">' + icon + '</span>' : '';
    var attr = open ? ' data-open="' + open + '"' : '';
    return '<div class="stat-card"' + attr + '>' + (charName ? sticker(charName) : "") + ic + '<span class="stat-body"><span class="stat-num">' + num + '</span><span class="stat-lbl">' + lbl + "</span></span></div>";
  }
  function byDateDesc(a, b) { return (b.finishedDate || "").localeCompare(a.finishedDate || ""); }
  function listCard(title, items, doneMode, charName) {
    var icon = doneMode ? "✅" : "📖";
    var body = "";
    if (!items.length) {
      body = '<div class="list-empty">还没有内容</div>';
    } else {
      items.forEach(function (b) {
        var meta = doneMode ? (b.finishedDate ? ("读完 · " + b.finishedDate) : "已读完") : (b.pages > 0 ? (progressOf(b) + "%") : "未开始");
        var thumb = b.cover ? ("<img src='" + esc(b.cover) + "' alt=''/>") : esc(defaultEmoji(b.name));
        body += '<div class="list-row" data-open="' + b.id + '"><span class="lr-thumb">' + thumb + '</span><span class="lr-name">' + esc(b.name) + "</span>" +
          '<span class="mini-bar" style="width:54px"><i style="width:' + progressOf(b) + '%"></i></span>' +
          '<span class="lr-meta">' + esc(meta) + "</span></div>";
      });
    }
    return '<section class="list-card">' + (charName ? sticker(charName) : "") + '<h2><span class="lc-ic">' + icon + '</span>' + esc(title) + "</h2>" + body + "</section>";
  }
  function renderDoneShelf() {
    var items = allItems().filter(isDone).sort(byDateDesc);
    var body = "";
    if (!items.length) {
      body = '<div class="shelf-empty">还没有读完的书 📚<br/>读完一本后，封面会出现在这里</div>';
    } else {
      body = '<div class="shelf-grid">';
      items.forEach(function (b) {
        var cover = b.cover
          ? '<img src="' + esc(b.cover) + '" alt="" loading="lazy" />'
          : '<span class="shelf-ph">' + esc(defaultEmoji(b.name)) + '</span>';

          '<div class="shelf-cover">' + cover + '</div>' +
          '<div class="shelf-name">' + esc(b.name) + '</div>' +

        '</div>' +
        body +
      '</div></div>';
    detail.querySelectorAll("[data-open]").forEach(function (el) {

  function renderCategoryPage(c) {
    var items = c.children || [];
    var body = '<div class="shelf-grid">';
    items.forEach(function (b) {
      var cover = b.cover
        ? '<img src="' + esc(b.cover) + '" alt="" loading="lazy" />'
        : '<span class="shelf-ph">' + esc(defaultEmoji(b.name)) + '</span>';
      body += '<div class="shelf-card" data-open="' + b.id + '">' +
        '<div class="shelf-cover" id="cover-' + b.id + '">' + cover + '</div>' +
        '<div class="shelf-name">' + esc(b.name) + '</div>' +
        '<button class="upload-cover-btn" type="button" data-book="' + b.id + '">📁 上传封面</button>' +
      '</div>';
    });
    // 末尾固定一个虚线「＋」添加框（与书籍卡片同尺寸），点击即添加新书籍
    body += '<div class="shelf-card shelf-add" data-act="add-book" data-cat="' + c.id + '">' +
              '<div class="shelf-add-box">＋</div>' +
            '</div>';
    body += '</div>';
    if (!items.length) {
      body += '<div class="shelf-empty">还没有书，点虚线方框添加第一本 📚</div>';
    }
    detail.innerHTML =
      '<div class="detail-inner"><div class="shelf-page">' +
        '<div class="shelf-head">' +
          '<button class="shelf-back" id="catBack" aria-label="返回">‹</button>' +
          '<div class="shelf-titlerow"><h2>' + esc(c.name) + '</h2><span class="shelf-count">共 ' + items.length + ' 本</span></div>' +
        '</div>' +
        body +
        '<input type="file" id="catCoverFile" accept="image/*" hidden />' +
      '</div></div>';
    var back = document.getElementById("catBack");
    if (back) back.addEventListener("click", goBack);
    var addBox = detail.querySelector(".shelf-add");
    if (addBox) addBox.addEventListener("click", function (e) { e.stopPropagation(); startAddItem(c.id); });
    detail.querySelectorAll("[data-open]").forEach(function (el) {
      var id = el.getAttribute("data-open");
      var lpTimer = null, lpFired = false, lpX = 0, lpY = 0;
      function clearLp() { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } }
      // 触摸长按（iOS/Android）：静止按住 ~0.5s 弹出删除确认
      el.addEventListener("touchstart", function (e) {
        if (e.touches.length !== 1) return;
        if (e.target.closest(".upload-cover-btn")) return;   // 上传封面按钮不触发长按
        lpFired = false;
        lpX = e.touches[0].clientX; lpY = e.touches[0].clientY;
        clearLp();
        lpTimer = setTimeout(function () {
          lpFired = true;
          var book = findNode(id);
          if (book) confirmDeleteBook(book);
        }, 520);
      }, { passive: true });
      el.addEventListener("touchmove", function (e) {
        if (!lpTimer) return;
        var t = e.touches[0];
        if (Math.abs(t.clientX - lpX) > 10 || Math.abs(t.clientY - lpY) > 10) clearLp();   // 滑动/滚动则放弃长按
      }, { passive: true });
      el.addEventListener("touchend", clearLp);
      el.addEventListener("touchcancel", clearLp);
      // 桌面端右键 = 删除确认
      el.addEventListener("contextmenu", function (e) {
        if (e.target.closest(".upload-cover-btn")) return;
        e.preventDefault();
        var book = findNode(id);
        if (book) confirmDeleteBook(book);
      });
      el.addEventListener("click", function () {
        if (lpFired) { lpFired = false; return; }   // 长按已触发弹窗，吞掉随后的点击
        data.selectedId = id;
        setSidebarActive(id);
        save(); renderSidebar(); renderDetail();
      });
    });
    /* 分类页：每本书「上传封面」按钮，选图后同步更新上方封面（不跳转、不刷新整页） */
    var catFile = document.getElementById("catCoverFile");
    var catCoverTarget = null;
    detail.querySelectorAll(".upload-cover-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation(); e.preventDefault();
        catCoverTarget = btn.getAttribute("data-book");
        if (catFile) catFile.click();
      });
    });
    if (catFile) {
      catFile.addEventListener("change", function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f || !catCoverTarget) { catFile.value = ""; return; }
        var bid = catCoverTarget; catCoverTarget = null;
        processImageFile(f, function (dataUrl) {
          var book = findNode(bid);
          if (book) { book.cover = dataUrl; save(); }
          var ce = document.getElementById("cover-" + bid);
          if (ce) ce.innerHTML = '<img src="' + esc(dataUrl) + '" alt="" />';
          catFile.value = "";
        });
      });
    }
  }

  function field(label, control) { return '<div class="field"><label>' + label + "</label>" + control + "</div>"; }
  function stepper(val) {
    return '<div class="stepper"><button type="button" id="cntMinus" aria-label="减少">−</button>' +
      '<input type="number" id="fCount" min="0" step="1" value="' + (val || 0) + '" />' +
      '<button type="button" id="cntPlus" aria-label="增加">＋</button></div>';
  }
  function progSubText(b) { return (!b.pages || b.pages <= 0) ? "登记总页数后自动计算进度" : ("已读 " + flowLatestPage(b) + " / " + b.pages + " 页"); }

  /* double-click to edit a title; returns to display on blur */
  function makeEditable(el, getVal, setVal) {
    el.addEventListener("dblclick", function () {
      if (el.isContentEditable) return;
      el.contentEditable = "true";
      el.classList.add("editing");
      el.focus();
      var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    });
    el.addEventListener("blur", function () {
      el.contentEditable = "false";
      el.classList.remove("editing");
      var v = (el.textContent || "").trim();
      setVal(v || getVal());
      if (!v) el.textContent = getVal();
    });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    });
  }

  function extrasHTML(b) {
    if (!b.extra || !b.extra.length) return "";
    var rows = b.extra.map(function (x) {
      return '<section class="card span2 extra-card" data-extra-id="' + x.id + '">' +
        '<h2 class="extra-h2">' +
          '<span class="sect-title extra-title" data-extra-id="' + x.id + '">' + esc(x.title) + '</span>' +

  function timelineHTML(b) {
    var entries = [];
    (b.readLog || []).forEach(function (r, i) {
      if (r.confirmed) {
        var title = (r.notes && r.notes.title) || "";
        var body = ((r.notes && r.notes.rows) || []).map(function (row) {
          return (row.left || "").trim() + (row.right ? " / " + row.right.trim() : "");
        }).filter(function (s) { return s; }).join("；");
        entries.push({ type: "read", idx: i, date: r.date || "", page: r.page || 0, title: title, body: body });
      }
    });
    (b.conclusionEntries || []).forEach(function (e) {
      entries.push({ type: "conclusion", id: e.id, date: e.date || "", text: e.text || "" });
    });
    if (!entries.length) return "";
    entries.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var rows = entries.map(function (e) {
      if (e.type === "read") {
        return '<div class="timeline-item timeline-read" data-log-idx="' + e.idx + '">' +
          '<div class="timeline-dot">📖</div>' +
          '<div class="timeline-content">' +
            '<div class="timeline-meta">' +
              '<span class="timeline-date">' + esc(e.date) + '</span>' +
              '<span class="timeline-page">观看至 ' + esc(String(e.page)) + ' 页</span>' +
            '</div>' +
            '<div class="timeline-title">' + esc(e.title || "未命名阅读") + '</div>' +
            '<div class="timeline-body">' + esc(e.body || "") + '</div>' +
          '</div>' +
          '<div class="timeline-actions">' +
            '<button class="icon-btn small edit-timeline-read" data-log-idx="' + e.idx + '" title="编辑" type="button">✎</button>' +
            '<button class="del-timeline-read" data-log-idx="' + e.idx + '" title="删除" type="button">✕</button>' +
          '</div>' +
        '</div>';
      } else {
        return '<div class="timeline-item timeline-conclusion" data-entry-id="' + esc(e.id) + '">' +
          '<div class="timeline-dot">✨</div>' +
          '<div class="timeline-content">' +
            '<div class="timeline-meta">' +
              '<span class="timeline-date">' + esc(e.date) + '</span>' +
              '<span class="timeline-tag">输出&应用</span>' +
            '</div>' +
            '<div class="timeline-body">' + esc(e.text || "").replace(/\n/g, "<br>") + '</div>' +
          '</div>' +
          '<div class="timeline-actions">' +
            '<button class="icon-btn small edit-timeline-conclusion" data-entry-id="' + esc(e.id) + '" title="编辑" type="button">✎</button>' +
            '<button class="del-timeline-conclusion" data-entry-id="' + esc(e.id) + '" title="删除" type="button">✕</button>' +
          '</div>' +
        '</div>';

    }).join("");
    return '<section class="card span2 timeline-card">' +
      '<h2><span class="num">📝</span><span class="sect-title">已记录</span></h2>' +
      '<div class="timeline-list">' + rows + '</div>' +
    '</section>';
  }

  /* 核心方框（复盘 / 输出&应用 …）：动态编号 + 每个可删除 */
  function coreBoxesHTML(b) {
    var removed = b.removedSections || [];
    if (removed.indexOf("summary") >= 0 && removed.indexOf("conclusions") >= 0) return "";
    var html = "";
    if (removed.indexOf("summary") < 0) {
      html += '<section class="card span2 core-card" data-core="summary">' +
        '<h2><span class="num">②</span>' +
        '<span class="sect-title renameable" data-sect="summary">' + esc(b.titles.summary) + '</span>' +
        '<button class="icon-btn small del-core" data-core="summary" title="删除此方框" type="button">🗑</button></h2>' +
        '<textarea id="fSummary" placeholder="核心观点、关键案例、印象最深的段落…">' + esc(b.summary) + '</textarea></section>';
    }
    if (removed.indexOf("conclusions") < 0) {
      var expanded = b.__conclusionsExpanded ? true : false;
      html += '<section class="card span2 core-card conclusions-card" data-core="conclusions">' +
        '<h2 class="conclusions-header" id="conclusionsHeader">' +
          '<span class="num">③</span>' +
          '<span class="sect-title renameable" data-sect="conclusions">' + esc(b.titles.conclusions) + '</span>' +
          '<span class="conclusions-toggle">' + (expanded ? '▲' : '▼') + '</span>' +
          '<button class="icon-btn small del-core" data-core="conclusions" title="删除此方框" type="button">🗑</button>' +
        '</h2>' +
        '<div class="conclusions-body" id="conclusionsBody" style="display:' + (expanded ? 'block' : 'none') + '">' +
          '<textarea id="fConclusions" class="lined-paper" placeholder="沉淀为可复用的原则 / 行动清单 / 一句话信条…">' + esc(b.conclusions) + '</textarea>' +
          '<div class="conclusions-confirm"><button class="btn btn-accent" id="confirmConclusions" type="button">确定</button></div>' +
        '</div></section>';
