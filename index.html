  var coverTimer = null;
  function bindItem(b) {
    var title = document.getElementById("bookTitle");
    if (title) {
    title.addEventListener("input", function () {
      b.name = title.value; save();
      var nm = catList.querySelector('.nav-name[data-node="' + b.id + '"]');
      if (nm) nm.value = b.name || "未命名";
      clearTimeout(coverTimer);
      coverTimer = setTimeout(function () {
        b.coverName = b.name;
        fetchCovers(b.name).then(function (urls) {
          b.coverList = urls;
          b.coverIndex = 0;
          applyCover(b, urls.length ? urls[0] : "");
        });
      }, 700);
    });
    title.addEventListener("dblclick", function () {
      title.readOnly = false; title.focus(); title.select();
    });
    title.addEventListener("blur", function () { title.readOnly = true; });
    }

    var fSummary = document.getElementById("fSummary");
    if (fSummary) fSummary.addEventListener("input", function () { b.summary = fSummary.value; save(); });

    /* 输出&应用：折叠面板 + 确定追加 */
    var conclusionsHeader = document.getElementById("conclusionsHeader");
    var conclusionsBody = document.getElementById("conclusionsBody");
    var fConclusions = document.getElementById("fConclusions");
    var confirmConclusions = document.getElementById("confirmConclusions");
    if (conclusionsHeader && conclusionsBody) {
      conclusionsHeader.addEventListener("click", function (e) {
        if (e.target.closest(".del-core")) return;
        b.__conclusionsExpanded = !b.__conclusionsExpanded;
        save(); renderItem(b);
      });
    }
    if (fConclusions) fConclusions.addEventListener("input", function () { b.conclusions = fConclusions.value; save(); });
    if (confirmConclusions) confirmConclusions.addEventListener("click", function () {
      var text = (fConclusions ? fConclusions.value : b.conclusions || "").trim();
      if (text) {
        b.conclusionEntries = b.conclusionEntries || [];
        b.conclusionEntries.push({ id: uid(), text: text, date: todayISO() });
      }
      b.conclusions = "";
      b.__conclusionsExpanded = false;
      save(); renderItem(b); renderSidebar();
    });

    /* 已记录时间线：编辑按钮 */
    detail.querySelectorAll(".edit-timeline-read").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(btn.getAttribute("data-log-idx"), 10);
        var r = (b.readLog || [])[idx];
        if (r) { r.confirmed = false; save(); renderItem(b); renderSidebar(); }
      });
    });
    detail.querySelectorAll(".edit-timeline-conclusion").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-entry-id");
        var entries = b.conclusionEntries || [];
        var e = entries.find(function (x) { return x.id === id; });
        if (e) {
          b.conclusions = e.text;
          b.conclusionEntries = entries.filter(function (x) { return x.id !== id; });
          b.__conclusionsExpanded = true;
          save(); renderItem(b); renderSidebar();
        }
      });
    });

    /* 已记录时间线：删除按钮 → 回收站 */
    detail.querySelectorAll(".del-timeline-read").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(btn.getAttribute("data-log-idx"), 10);
        softDeleteTimelineRead(b, idx);
      });
    });
    detail.querySelectorAll(".del-timeline-conclusion").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-entry-id");
        softDeleteTimelineConclusion(b, id);
      });
    });

    /* 删除核心方框（复盘 / 内化出的结论 …） */
    detail.querySelectorAll('.del-core').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-core");
        b.removedSections = b.removedSections || [];
        if (b.removedSections.indexOf(key) < 0) b.removedSections.push(key);
        save(); renderItem(b); renderSidebar();
      });
    });

    document.getElementById("delBook").addEventListener("click", function () {
      softDelete(b);
    });

    var back = document.getElementById("backBtn");
    if (back) back.addEventListener("click", goBack);

    var ai = document.getElementById("coverAI");
    if (ai) ai.addEventListener("click", function () {
      ai.classList.add("loading");
      if (b.coverList && b.coverList.length > 1) {
        b.coverIndex = (b.coverIndex + 1) % b.coverList.length;
        applyCover(b, b.coverList[b.coverIndex]);
        ai.classList.remove("loading");
      } else {
        fetchCovers(b.name).then(function (urls) {
          b.coverList = urls;
          b.coverIndex = 0;
          applyCover(b, urls.length ? urls[0] : "");
          ai.classList.remove("loading");
        });
      }
    });

    var upload = document.getElementById("coverUpload");
    var fileInput = document.getElementById("coverFile");
    if (upload && fileInput) {
      upload.addEventListener("click", function () { fileInput.click(); });
      fileInput.addEventListener("change", function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        processImageFile(f, function (dataUrl) { applyCover(b, dataUrl); });
        fileInput.value = "";
      });
    }

    /* double-click to rename section titles (阅读进度与登记 / 内容总结 / 复盘 / 内化出的结论) */
    detail.querySelectorAll('.sect-title[data-sect]').forEach(function (el) {
      var sect = el.getAttribute("data-sect");
      if (sect === "extra") return;
      makeEditable(el,
        function () { return b.titles[sect]; },
        function (v) { b.titles[sect] = v; save(); });
    });
    bindExtras(b);
    bindFlow(b);
  }

  function bindExtras(b) {
    (b.extra || []).forEach(function (x) {
      var t = detail.querySelector('.extra-title[data-extra-id="' + x.id + '"]');
      if (t) makeEditable(t,
        function () { return x.title; },
        function (v) { x.title = v; save(); });
      var body = detail.querySelector('[data-extra-body="' + x.id + '"]');
      if (body) body.addEventListener("input", function () { x.body = body.value; save(); });
      var del = detail.querySelector('.del-extra[data-extra-id="' + x.id + '"]');
      if (del) del.addEventListener("click", function () {
        b.extra = (b.extra || []).filter(function (y) { return y.id !== x.id; });
        save(); renderItem(b); renderSidebar();
      });
    });
    var add = document.getElementById("addExtra");
    if (add) add.addEventListener("click", function () {
      b.extra = b.extra || [];
      b.extra.push({ id: uid(), title: "补充栏 " + (b.extra.length + 1), body: "" });
      save(); renderItem(b);
    });
  }

  /* 阅读进度：阅读记录(日期→页数) + 自动进度条 + 内容方框 */
  function flowLatestPage(b) {
    var log = b.readLog || [], max = 0;
    log.forEach(function (r) { var p = clampInt(r.page || 0, 0); if (p > max) max = p; });
    return max;
  }
  function flowPct(b) {
    var total = clampInt(b.pages || 0, 0);
    if (!total) return 0;
    return Math.min(100, Math.round(flowLatestPage(b) / total * 100));
  }
  function flowSubText(b) {
    var total = clampInt(b.pages || 0, 0);
    if (!total) return "登记总页数后，进度条按阅读记录自动计算";
    return "最新读到 " + flowLatestPage(b) + " / " + total + " 页（共 " + ((b.readLog || []).length) + " 条记录）";
  }
  function updateFlowBar(b) {
    var pct = flowPct(b);
    var fill = document.getElementById("flowFill");
    var bar = document.getElementById("flowBar");
    var sub = document.getElementById("flowSub");
    var pl = document.getElementById("flowPct");
    if (fill) fill.style.width = pct + "%";
    if (bar) bar.classList.toggle("is-done", b.pages > 0 && flowLatestPage(b) >= clampInt(b.pages, 0));
    if (sub) sub.textContent = flowSubText(b);
    if (pl) pl.textContent = pct + "%";
  }
  function noteRowsHTML(rows, logIdx) {
    var colors = [{k:"ink",l:"黑"},{k:"red",l:"红"},{k:"blue",l:"蓝"},{k:"green",l:"绿"},{k:"purple",l:"紫"}];
    return (rows || []).map(function (row, ri) {
      return '<div class="note-row" data-log-idx="' + logIdx + '" data-row-idx="' + ri + '" data-color="' + esc(row.color || "ink") + '">' +
        '<button class="note-del-row" type="button" data-del-row="' + logIdx + '" data-row-idx="' + ri + '" title="删除此行（进入回收站）">✕</button>' +
        '<div class="note-col note-col-left">' +
          '<textarea class="note-left" data-log-idx="' + logIdx + '" data-row-idx="' + ri + '" placeholder="要点 / 方法 / 概念">' + esc(row.left || "") + '</textarea>' +
        '</div>' +
        '<div class="note-col note-col-right">' +
          '<textarea class="note-right" data-log-idx="' + logIdx + '" data-row-idx="' + ri + '" placeholder="案例 / 例子 / 延伸">' + esc(row.right || "") + '</textarea>' +
        '</div>' +
      '</div>';
    }).join("") +
    '<div class="note-actions">' +
      '<button class="btn-add-row" type="button" data-log-idx="' + logIdx + '">＋ 添加一行</button>' +
      colors.map(function (c) {
        return '<button class="note-color note-color-' + c.k + '" data-color="' + c.k + '" data-log-idx="' + logIdx + '" title="整页标记为' + c.l + '色" type="button"></button>';
      }).join("") +
    '</div>';
  }
  function noteSheetHTML(r, i) {
    var rows = (r.notes && r.notes.rows) ? r.notes.rows : [];
    if (!rows.length) rows = [newNoteRow(r.summary || "", r.review || "", "ink")];
    return '<div class="note-sheet">' +
      '<div class="note-punch">' + Array(6).fill('<i></i>').join("") + '</div>' +
      '<div class="note-body">' +
        '<input type="text" class="note-title" data-log-idx="' + i + '" placeholder="本页标题（如：赢得用户信任）" value="' + esc((r.notes && r.notes.title) || "") + '" />' +
        '<div class="note-rows" data-log-idx="' + i + '">' + noteRowsHTML(rows, i) + '</div>' +
      '</div>' +
    '</div>';
  }
  function readBlocksHTML(b) {
    var log = (b.readLog || []).filter(function (r) { return r.confirmed !== true; });
    if (!log.length) return '<div class="log-empty">还没有阅读记录，点下方「＋ 添加阅读记录」新建一个阅读板块吧</div>';
    return log.map(function (r, i) {
      var idx = (b.readLog || []).indexOf(r);
      return '<div class="session-block session-edit" data-log-idx="' + idx + '">' +
        '<div class="session-head">' +
          '<span class="session-idx">📅 第 ' + (idx + 1) + ' 次阅读</span>' +
          '<button class="icon-btn small del-log" data-log-idx="' + idx + '" title="删除本次阅读板块" type="button">🗑</button>' +
        '</div>' +
        '<div class="session-row session-row-h">' +
          '<div class="session-field session-field-h"><div class="session-label">日期</div><input type="date" class="log-date" value="' + esc(r.date || "") + '" /></div>' +
          '<div class="session-field session-field-h"><div class="session-label">观看至</div><input type="number" class="log-page underline-input" min="0" placeholder="____" value="' + (r.page != null ? r.page : "") + '" /><span class="session-suffix">页</span></div>' +
        '</div>' +

  function noteSheetEditHTML(r, i) {
    var rows = (r.notes && r.notes.rows) ? r.notes.rows : [];
    if (!rows.length) rows = [newNoteRow(r.summary || "", r.review || "", "ink")];
    return '<div class="note-sheet-edit">' +
      '<input type="text" class="note-title" data-log-idx="' + i + '" placeholder="本页标题（如：赢得用户信任）" value="' + esc((r.notes && r.notes.title) || "") + '" />' +
      '<div class="note-rows-edit" data-log-idx="' + i + '">' + noteRowsEditHTML(rows, i) + '</div>' +
    '</div>';

  function noteRowsEditHTML(rows, logIdx) {
    return (rows || []).map(function (row, ri) {
      return '<div class="note-row-edit" data-log-idx="' + logIdx + '" data-row-idx="' + ri + '" data-color="' + esc(row.color || "ink") + '">' +
        '<textarea class="note-left-edit" data-log-idx="' + logIdx + '" data-row-idx="' + ri + '" placeholder="要点 / 方法 / 概念">' + esc(row.left || "") + '</textarea>' +
        '<textarea class="note-right-edit" data-log-idx="' + logIdx + '" data-row-idx="' + ri + '" placeholder="案例 / 例子 / 延伸">' + esc(row.right || "") + '</textarea>' +
      '</div>';

  /* flowBoxesHTML 已弃用：阅读板块现在每个记录自带 内容整理总结 + 复盘 */
  function flowHTML(b) {
    return '<section class="card span2 flow-card">' +
      '<h2><span class="num">📖</span><span class="sect-title renameable" data-sect="flow">' + esc(b.titles.flow) + '</span></h2>' +
      '<div class="flow-top">' + field("整本书总页数", '<input type="number" id="fPagesFlow" min="0" step="1" value="' + (b.pages || "") + '" placeholder="如 320" />') + '</div>' +
      '<div class="progress-bar flow-bar" id="flowBar"><div class="progress-fill" id="flowFill" style="width:' + flowPct(b) + '%"></div></div>' +
      '<div class="progress-label"><span class="progress-sub" id="flowSub">' + flowSubText(b) + '</span><b id="flowPct">' + flowPct(b) + '%</b></div>' +
      '<button class="btn btn-accent add-log-block" id="addLog" type="button">＋ 添加阅读记录</button>' +
      '<div class="read-blocks" id="readBlocks">' + readBlocksHTML(b) + '</div>' +

  function bindFlow(b) {
    var pf = document.getElementById("fPagesFlow");
    if (pf) pf.addEventListener("input", function () {
      b.pages = pf.value === "" ? 0 : clampInt(pf.value, 0);
      save(); updateProgress(b); updateFlowBar(b);
      var f1 = document.getElementById("fPages"); if (f1) f1.value = pf.value;
    });
    var addLog = document.getElementById("addLog");
    if (addLog) addLog.addEventListener("click", function () {
      b.readLog = b.readLog || [];
      b.readLog.push({ date: todayISO(), page: flowLatestPage(b), summary: "", review: "", notes: { title: "", rows: [newNoteRow("", "", "ink")] }, confirmed: false });
      save(); renderItem(b); renderSidebar();
    });
    bindReadBlocks(b);
  }
  function bindReadBlocks(b) {
    detail.querySelectorAll('.session-block[data-log-idx]').forEach(function (block) {
      var idx = parseInt(block.getAttribute("data-log-idx"), 10);
      var r = (b.readLog || [])[idx];
      if (!r || r.confirmed) return;
      var d = block.querySelector(".log-date");
      var p = block.querySelector(".log-page");
      var del = block.querySelector(".del-log");
      var confirm = block.querySelector(".confirm-log");
      if (d) d.addEventListener("input", function () { r.date = d.value; save(); });
      if (p) p.addEventListener("input", function () { r.page = p.value === "" ? 0 : clampInt(p.value, 0); save(); updateFlowBar(b); updateProgress(b); });
      if (del) del.addEventListener("click", function () {
        b.readLog = (b.readLog || []).filter(function (_, i) { return i !== idx; });
        save(); renderItem(b); renderSidebar();
      });
      if (confirm) confirm.addEventListener("click", function () {
        r.confirmed = true;
        save(); renderItem(b); renderSidebar();
      });
      /* 手写笔记内容框绑定 */
      bindNoteSheetEdit(block, r, b);
    });
  }
  function bindNoteSheetEdit(block, r, b) {
    if (!r.notes) r.notes = { title: "", rows: [] };
    var nt = block.querySelector(".note-title");
    if (nt) nt.addEventListener("input", function () { r.notes.title = nt.value; save(); });
    block.querySelectorAll(".note-row-edit").forEach(function (rowEl) {
      var ri = parseInt(rowEl.getAttribute("data-row-idx"), 10);
      var row = r.notes.rows[ri];

      var left = rowEl.querySelector(".note-left-edit");
      var right = rowEl.querySelector(".note-right-edit");
      if (left) left.addEventListener("input", function () { row.left = left.value; save(); });
      if (right) right.addEventListener("input", function () { row.right = right.value; save(); });
    });
  }
  function bindNoteSheet(block, r, b) {
    if (!r.notes) r.notes = { title: "", rows: [] };
    var nt = block.querySelector(".note-title");
    if (nt) nt.addEventListener("input", function () { r.notes.title = nt.value; save(); });
    block.querySelectorAll(".note-row").forEach(function (rowEl) {
      var ri = parseInt(rowEl.getAttribute("data-row-idx"), 10);
      var row = r.notes.rows[ri];
      if (!row) return;
      var left = rowEl.querySelector(".note-left");
      var right = rowEl.querySelector(".note-right");
      if (left) left.addEventListener("input", function () { row.left = left.value; save(); });
      if (right) right.addEventListener("input", function () { row.right = right.value; save(); });
      var delRow = rowEl.querySelector(".note-del-row");
      if (delRow) delRow.addEventListener("click", function (ev) {
        ev.stopPropagation();
        softDeleteNoteRow(b, parseInt(rowEl.getAttribute("data-log-idx"), 10), ri);
      });
    });
    var addRow = block.querySelector(".btn-add-row");
    if (addRow) addRow.addEventListener("click", function () {
      r.notes.rows.push(newNoteRow("", "", "ink"));
      save(); renderItem(b); renderSidebar();
    });
    block.querySelectorAll(".note-color").forEach(function (btn) {
      btn.addEventListener("click", function () {

  /* process uploaded cover image (downscaled to keep localStorage small) */
  function processImageFile(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxW = 640;
        if (img.width <= maxW) { cb(reader.result); return; }
        var scale = maxW / img.width;
        var w = maxW, h = Math.round(img.height * scale);
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        try { cb(c.toDataURL("image/jpeg", 0.85)); } catch (e) { cb(reader.result); }
      };
      img.onerror = function () { cb(reader.result); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

      if (!n) return;
      var onTitle = !!e.target.closest('[data-act="rename"]');
      if (onTitle) {
        /* 连续点标题 3 次 → 进入改名；自动回弹到点击前的折叠态，避免来回跳动 */
        var tid = n.id;
        if (!tripleClicks[tid]) tripleClicks[tid] = { c: 0 };
        if (tripleClicks[tid].c === 0) tripleClicks[tid].orig = n.collapsed;
        tripleClicks[tid].c++;
        clearTimeout(tripleClicks[tid].t);
        tripleClicks[tid].t = setTimeout(function () { tripleClicks[tid].c = 0; }, 500);
        if (tripleClicks[tid].c >= 3) {

      return;
    }
    var tr = e.target.closest('[data-act="trash"]');
    if (tr) { e.stopPropagation(); data.selectedId = "trash", save(); renderSidebar(); renderDetail(); return; }
    var tool = e.target.closest('[data-act="export"], [data-act="import"], [data-act="copy"]');
    if (tool) {
      e.stopPropagation();
      var act = tool.getAttribute("data-act");
      if (act === "export") { exportData(); }
      else if (act === "import") { var fi = document.getElementById("importFile"); if (fi) fi.click(); }
      else if (act === "copy") { copyPermaUrl(); }
      return;
    }
    var sel = e.target.closest('[data-act="select"]');
    var nameEl = e.target.closest('[data-act="rename"]');
    var editingName = nameEl && !nameEl.readOnly;
    /* 总类目标题三连击改名 */
    if (nameEl && !editingName) {
      var rn = findNode(nameEl.getAttribute("data-node"));
      if (rn && rn.type === "category") {
        var tid = rn.id;
        if (!tripleClicks[tid]) tripleClicks[tid] = { c: 0 };
        tripleClicks[tid].c++;
        clearTimeout(tripleClicks[tid].t);
        tripleClicks[tid].t = setTimeout(function () { tripleClicks[tid].c = 0; }, 500);
        if (tripleClicks[tid].c >= 3) {
          tripleClicks[tid].c = 0;
          var inp = catList.querySelector('.nav-name[data-node="' + tid + '"]');
          if (inp) { inp.readOnly = false; inp.focus(); inp.select(); }
          return;
        }
      }
    }
    if (sel && !editingName) {
      /* 搜索结果中点选：先清空搜索，让左侧栏恢复原始（非搜索）状态，再打开目标 */
      if (data.search) {
        data.search = "";
        if (searchInput) searchInput.value = "";
        save();
        renderSidebar();
      }
      var id = sel.getAttribute("data-node");
      if (id !== data.selectedId) { data.selectedId = id; setSidebarActive(id); save(); renderDetail(); }
      closeNav();
    }
  });

  /* 左滑删除手势：在总类目行/子类目行上向左滑动，露出"删除"键；点删除→软删除进回收站 */
  var swipeRow = null;
  function closeSwipe() { if (swipeRow) { swipeRow.classList.remove('swiped'); swipeRow = null; } }
  catList.addEventListener("pointerdown", function (e) {
    var row = e.target.closest('.swipe-row');
    if (swipeRow && (!row || !swipeRow.contains(e.target))) closeSwipe();
    if (!row) return;
    row._suppressClick = false; // 新的一次手势开始：清掉上一次滑动遗留的抑制标记，避免误吞删除点击
    row._sx = e.clientX; row._sy = e.clientY; row._sw = false; row._moved = false;
  }, { passive: true });
  catList.addEventListener("pointermove", function (e) {
    var row = e.target.closest('.swipe-row');
    if (!row || row._sx === undefined) return;
    var dx = e.clientX - row._sx, dy = e.clientY - row._sy;
    if (!row._moved && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) {
      row._sw = true; row._moved = true; row.classList.add('swiping');
      if (swipeRow && swipeRow !== row) closeSwipe();
      try { row.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (row._sw) {
      if (e.cancelable) e.preventDefault();
      var t = Math.max(-76, Math.min(0, dx));
      var front = row.querySelector('.cat-head, .book-item');
      if (front) front.style.transform = 'translateX(' + t + 'px)';
    }
  }, { passive: false });
  catList.addEventListener("pointerup", function (e) {
    var row = e.target.closest('.swipe-row');
    if (!row || row._sx === undefined) return;
    var dx = e.clientX - row._sx;
    var front = row.querySelector('.cat-head, .book-item');
    if (row._sw) {
      if (e.cancelable) e.preventDefault();
      if (front) front.style.transform = '';
      row.classList.remove('swiping');
      if (dx < -40) { row.classList.add('swiped'); swipeRow = row; }
      else { row.classList.remove('swiped'); if (swipeRow === row) swipeRow = null; }
      row._suppressClick = true; // 抑制滑动结束后误触发的 click
    }
    row._sx = undefined; row._sw = false; row._moved = false;
  }, { passive: false });
  catList.addEventListener("scroll", closeSwipe, { passive: true });

  catList.addEventListener("focusout", function (e) {
    var rn = e.target.closest('[data-act="rename"]');
    if (!rn) return;
    rn.readOnly = true;
    var n = findNode(rn.getAttribute("data-node"));
    if (n) {
      n.name = rn.value.trim() || "未命名";
      save();
      if (n.id === data.selectedId) { var t = document.getElementById("bookTitle"); if (t) t.value = n.name; }
    }
  });
  catList.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.closest('[data-act="rename"]')) { e.preventDefault(); e.target.blur(); }
  });

  document.getElementById("toastUndo").addEventListener("click", undoDelete);
  var heroBgFileInput = document.getElementById("heroBgFile");
  if (heroBgFileInput) heroBgFileInput.addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    compressBg(f, function (out) { data.heroBgImage = out; save(); applyHeroBackground(); });
  });
  /* ===== 双击背景：更换 / 恢复默认 ===== */
  var bgMenu = document.getElementById("bgMenu");
  var bgFileInput = document.getElementById("bgFile");
  function openBgMenu(x, y) {
    if (!bgMenu) return;
    bgMenu.classList.add("show");
    var w = bgMenu.offsetWidth, h = bgMenu.offsetHeight;
    var px = Math.min(x, window.innerWidth - w - 10);
    var py = Math.min(y, window.innerHeight - h - 10);
    bgMenu.style.left = Math.max(10, px) + "px";
    bgMenu.style.top = Math.max(10, py) + "px";
  }
  function hideBgMenu() { if (bgMenu) bgMenu.classList.remove("show"); }
  if (bgMenu) {
    bgMenu.addEventListener("click", function (e) {
      var act = e.target.closest("[data-act]"); if (!act) return;
      var a = act.getAttribute("data-act");
      if (a === "bg-pick") {
        hideBgMenu();
        if (bgFileInput) { bgFileInput.value = ""; bgFileInput.click(); }
      } else if (a === "bg-reset") {
        data.bgImage = ""; save(); applyBackground(); hideBgMenu();
        showToast("已恢复默认背景 ✅");
      }
    });
  }
  if (bgFileInput) bgFileInput.addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    compressBg(f, function (out) { data.bgImage = out; save(); applyBackground(); showToast("背景已更新 ✅"); });
  });
  document.addEventListener("dblclick", function (e) {
    if (e.target.closest(".sidebar, .card, .stat-card, .list-card, .scrim, .toast, .emoji-pop, .add-emoji-pop, .bg-menu, button, input, textarea, a, .title-screen, .book-item, .cat-list, .note-sheet, .session-block, .modal, .nav-tool, .cover, .welcome")) return;
    e.preventDefault();
    openBgMenu(e.clientX, e.clientY);
  });
  document.addEventListener("click", function (e) { if (bgMenu && !bgMenu.contains(e.target)) hideBgMenu(); });
  document.addEventListener("scroll", hideBgMenu, true);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideBgMenu(); });
  searchInput.addEventListener("input", function () { data.search = searchInput.value; renderSidebar(); });

  /* ===== 数据导出 / 导入（防止丢失） ===== */
  function showToast(msg) {
    var toast = document.getElementById("toast");
    var m = document.getElementById("toastMsg");
    if (!toast || !m) return;
    m.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function exportData() {
    try {
      var raw = localStorage.getItem(STORE_KEY) || "{}";
      var blob = new Blob([raw], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var d = new Date(), pad = function (n) { return (n < 10 ? "0" : "") + n; };
      a.href = url;
      a.download = "reading-workbench-backup-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast("已导出备份文件 ✅");
    } catch (e) { showToast("导出失败：" + e.message); }
  }
  function importData(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var obj = JSON.parse(reader.result);
        if (!obj || typeof obj !== "object" || !obj.nodes) throw new Error("不是有效的备份文件");
        if (!confirm("导入会覆盖当前设备上的全部数据，确定继续？")) return;
        localStorage.setItem(STORE_KEY, JSON.stringify(obj));
        showToast("导入成功，正在刷新…");
        setTimeout(function () { location.reload(); }, 700);
      } catch (e) { showToast("导入失败：" + e.message); }
    };
    reader.readAsText(file);
  }
  document.getElementById("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    importData(f); e.target.value = "";
  });

  /* 自定义 App 图标 */
  var PERMA_URL = "https://suki057.github.io/reading-room/";
  function applyAvatar() {
    /* 侧栏头像：运行时改用用户上传的图（dataURL）。 */
    /* 主屏图标固定走仓库里的 icon-192.png 文件，避免 iOS 对 dataURL apple-touch-icon 支持不可靠。 */
    var img = document.getElementById("avatarImg");
    var emoji = document.getElementById("avatarEmoji");
    if (data.appIcon) {
      if (img) { img.src = data.appIcon; img.hidden = false; }
      if (emoji) emoji.style.display = "none";
    } else {
      if (img) { img.hidden = true; img.removeAttribute("src"); }
      if (emoji) emoji.style.display = "";
    }
  }
  function resizeIcon(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var im = new Image();
      im.onload = function () {
        var s = 512, c = document.createElement("canvas");
        c.width = c.height = s;
        var ctx = c.getContext("2d");
        ctx.clearRect(0, 0, s, s);
        /* 居中裁剪为正方形 */
        var side = Math.min(im.width, im.height);
        var sx = (im.width - side) / 2, sy = (im.height - side) / 2;
        ctx.drawImage(im, sx, sy, side, side, 0, 0, s, s);
        cb(c.toDataURL("image/png"));
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  /* 侧栏头像：双击即可更换图标（移动端可拍照或选图） */
  var avatarEl = document.getElementById("avatar");
  if (avatarEl) avatarEl.addEventListener("dblclick", function () { var fi = document.getElementById("iconFile"); if (fi) { fi.value = ""; fi.click(); } });
  document.getElementById("iconFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    resizeIcon(f, function (url) {
      data.appIcon = url; save(); applyAvatar();
      showToast("图标已更新 ✅ 重新「添加到主屏幕」即可生效");
    });
    e.target.value = "";
  });
  function copyPermaUrl() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(PERMA_URL).then(function () { showToast("已复制永久地址 ✅"); }, function () { showToast("复制失败，请手动复制：" + PERMA_URL); });
    } else {
      showToast("永久地址：" + PERMA_URL);
    }
  }

  /* theme */
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", data.theme || "light");
    var icon = document.getElementById("themeIcon");
    if (!icon) return;
    if (data.theme === "dark") icon.innerHTML = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
    else icon.innerHTML = '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';
  }
  var themeToggleBtn = document.getElementById("themeToggle");
  if (themeToggleBtn) themeToggleBtn.addEventListener("click", function () {
    data.theme = data.theme === "dark" ? "light" : "dark"; save(); applyTheme();
  });

  /* mobile nav */
  function openNav() { app.classList.add("nav-open"); }
  function closeNav() { app.classList.remove("nav-open"); }
  document.getElementById("sidebarToggle").addEventListener("click", openNav);
  document.getElementById("scrim").addEventListener("click", closeNav);

  var data = load();
  data.selectedId = "home"; /* 打开 App 时始终先进入首页 */
  save(); /* 持久化 migrate 后的数据 */
  applyTheme();
  applyBackground();
  applyAvatar();
  renderSidebar();
  renderDetail();
  var brandTitleEl = document.getElementById("brandTitle");
  if (brandTitleEl) { brandTitleEl.textContent = getAppTitle(); makeEditable(brandTitleEl, getAppTitle, setAppTitle); }

  /* 主内容区：屏幕任意位置向右滑动返回上一级（Touch Events，绑定在 detail）
     ★ 关键：最终判定只看「起点→终点坐标差」(onEnd)，不依赖 touchmove 是否可取消。
     原因：iOS Safari 对滚动容器内第一次手势常把 touchmove 当纵向滚动吞掉，
     旧实现靠 touchmove 设 dir，dir 永远为 0 → 首次滑动作废、要滑两次。
     现改为 touchend 直接按坐标差判定，touchmove 被吞也不影响返回。 */
  (function () {
    if (!detail) return;
    if (!('ontouchstart' in window)) return;   // 仅触摸设备启用，桌面用返回按钮
    var sx = 0, sy = 0, tracking = false, dir = 0;
    var MAX = 260, TH = 30;
    function reset() { detail.style.transition = "none"; detail.style.transform = ""; }
    function onStart(e) {
      if (data.selectedId === "home") { tracking = false; return; }   // 首页不触发
      if (e.touches.length !== 1) { tracking = false; return; }
      tracking = true; dir = 0;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      detail.style.transition = "none";
    }
    function onMove(e) {
      if (!tracking) return;
      if (e.touches.length !== 1) return;
      var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
      if (dir === 0 && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        dir = (Math.abs(dx) > Math.abs(dy)) ? (dx > 0 ? 1 : -1) : 0;  // 1 右滑 / -1 左滑 / 0 竖向(交还浏览器)
      }
      if (dir === 1) {   // 已判定为右滑：尽量跟手并阻止横滚（iOS 若忽略也不影响最终判定）
        if (e.cancelable) { try { e.preventDefault(); } catch (err) {} }
        detail.style.transform = "translateX(" + Math.min(dx, MAX) + "px)";
      }
      // dir 为 0 或 -1：不干预，交还浏览器（竖向滚动 / 左滑）
    }
    function onEnd(e) {
      if (!tracking) return;
      tracking = false;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) { reset(); return; }
      var dx = t.clientX - sx, dy = t.clientY - sy;
      // 最终判定只看起点→终点：横向且右向、位移足够 → 返回（与 touchmove 是否被吞无关）
      var right = dx > TH && dx > Math.abs(dy) * 0.85;
      detail.style.transition = "transform .22s ease";
      if (right) {
        detail.style.transform = "translateX(110%)";
        window.__swipeBack = true;          // 抑制紧随其后的误触点击（如分类页卡片被误打开）
        setTimeout(function () { goBack(); reset(); }, 140);
        setTimeout(function () { window.__swipeBack = false; }, 500);  // iOS 右滑不产生 click，超时自动清除，避免误吞后续点击
      } else {
        detail.style.transform = "translateX(0)";
        setTimeout(reset, 230);
      }
    }
    detail.addEventListener("touchstart", onStart, { passive: true });
    detail.addEventListener("touchmove", onMove, { passive: false });
    detail.addEventListener("touchend", onEnd, { passive: true });
    detail.addEventListener("touchcancel", function () { tracking = false; dir = 0; reset(); });
    // 右滑返回后，抑制紧随其后的误触点击（避免分类页卡片被误打开）
    document.addEventListener("click", function (e) {
      if (window.__swipeBack) { e.preventDefault(); e.stopPropagation(); window.__swipeBack = false; }
    }, true);
  })();
})();

/* PWA: 注册 Service Worker，使手机可「添加到主屏幕」当作 App 使用，并支持离线。
   注意：不再自动刷新页面。新版本会在你下次手动打开 / 刷新时生效，
   避免使用时页面突然自刷新打断操作。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    var swMeta = document.querySelector('meta[name="build"]');
    var vb = document.getElementById('verBadge');
    if (vb) vb.textContent = (swMeta ? swMeta.getAttribute('content') : '');
    var swUrl = 'sw.js?v=' + (swMeta ? encodeURIComponent(swMeta.getAttribute('content')) : Date.now());
    // 仅注册一次；不监听 controllerchange，也不轮询更新，避免在浏览时自动刷新
    navigator.serviceWorker.register(swUrl).catch(function () {});
  });
}

/* 通知权限：仅「首次进入」请求一次，并用 localStorage 记住。
   之后不再请求，避免浏览器反复弹出「是否允许发送通知」提示。
   备注：若你之前在浏览器里选过「允许一次」，本次会再请你做最终决定；
   选「允许」或「阻止」后即永久不再弹出。 */
(function () {
  try {
    if (!('Notification' in window)) return;
    var KEY = 'suki_notify_prompted';
    if (localStorage.getItem(KEY) === '1') return;            // 已询问过，不再弹
    if (Notification.permission !== 'default') {              // 已做过永久决定
      localStorage.setItem(KEY, '1');
      return;
    }
    var done = false;
    function ask() {
      if (done) return; done = true;
      Notification.requestPermission().then(function () {
        localStorage.setItem(KEY, '1');                       // 已询问一次，之后不再请求
      }).catch(function () {});
    }
    window.addEventListener('click', ask, { once: true });      // 首次真实交互后再请求，避免一打开就弹
    window.addEventListener('touchstart', ask, { once: true });
  } catch (e) {}
})();

</script>
<div id="verBadge" class="ver-badge"></div>
</body>
</html>
